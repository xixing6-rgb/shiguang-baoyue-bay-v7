    // ==================== 10. Canvas 世界 & 室内渲染 ====================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let viewW = window.innerWidth, viewH = window.innerHeight;
    let camX = -6, camZ = -14, camZoom = 14.5; // pixels per meter (~14.5 => 1200px shows ~82m, cozy close diorama at ~18)
    camZoom = 17.5;
    let camPanOffset = { x: 0, z: 0 };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      viewW = window.innerWidth; viewH = window.innerHeight;
      canvas.width = Math.round(viewW * dpr);
      canvas.height = Math.round(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function rRect(c, x, y, w, h, r) {
      const rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      c.beginPath();
      c.moveTo(x + rad, y);
      c.lineTo(x + w - rad, y);
      c.quadraticCurveTo(x + w, y, x + w, y + rad);
      c.lineTo(x + w, y + h - rad);
      c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
      c.lineTo(x + rad, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - rad);
      c.lineTo(x, y + rad);
      c.quadraticCurveTo(x, y, x + rad, y);
      c.closePath();
    }

    function worldToScreen(wx, wy, wz) {
      const sx = viewW / 2 + (wx - camX) * camZoom;
      const sy = viewH / 2 - (wz - camZ) * camZoom * 0.86 - wy * camZoom * 0.65;
      return { sx, sy };
    }

    function screenToWorldGround(sx, sy) {
      const wx = camX + (sx - viewW / 2) / camZoom;
      const wz = camZ - (sy - viewH / 2 + 1.2 * camZoom * 0.65) / (camZoom * 0.86);
      return { wx, wz };
    }

    function drawPolyWorld(pts, fill, stroke, lineW = 1.5) {
      ctx.beginPath();
      pts.forEach(([x, y, z], i) => {
        const p = worldToScreen(x, y, z);
        if (i === 0) ctx.moveTo(p.sx, p.sy);
        else ctx.lineTo(p.sx, p.sy);
      });
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.stroke(); }
    }

    function drawTerrainLayer(tSec) {
      // 3-band emerald/turquoise sea
      const seaGrad = ctx.createLinearGradient(0, 0, 0, viewH);
      if (state.timeSlot === "night") {
        seaGrad.addColorStop(0, "#213654"); seaGrad.addColorStop(1, "#2D5278");
      } else if (state.timeSlot === "dusk") {
        seaGrad.addColorStop(0, "#6BA8C7"); seaGrad.addColorStop(1, "#98C5D4");
      } else {
        seaGrad.addColorStop(0, "#5EB4DA"); seaGrad.addColorStop(0.5, "#7CC6E8"); seaGrad.addColorStop(1, "#9AD8F0");
      }
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, 0, viewW, viewH);

      // Gentle wave ripples
      ctx.strokeStyle = state.timeSlot === "night" ? "rgba(255,214,122,0.14)" : "rgba(255,255,255,0.28)";
      ctx.lineWidth = 1.8;
      for (let gx = -78; gx <= 78; gx += 16) {
        for (let gz = -60; gz <= 70; gz += 14) {
          const ox = Math.sin(tSec * 1.1 + gz) * 1.2;
          const p1 = worldToScreen(gx + ox, 0, gz);
          const p2 = worldToScreen(gx + 5 + ox, 0, gz);
          ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.lineTo(p2.sx, p2.sy); ctx.stroke();
        }
      }

      // L0 Crescent Bay Sand Base (Zone 0 + Zone W + Zone E + Zone S)
      const sandRim = state.timeSlot === "night" ? "#9C927F" : "#F5E6C8";
      const sandEdge = "rgba(255, 250, 240, 0.55)";
      // Main Crescent Landmass L0
      drawPolyWorld([
        [-64, 0.1, -33], [-42, 0.1, -35], [-31, 0.1, -24], [0, 0.1, -22], [31, 0.1, -24],
        [45, 0.1, -36], [63, 0.1, -34], [64, 0.1, 34], [52, 0.1, 64], [-52, 0.1, 64], [-64, 0.1, 34]
      ], sandRim, sandEdge, 5);

      // Zone S Crescent Islet L0
      drawPolyWorld([
        [-22, 0.1, -35], [16, 0.1, -35], [20, 0.1, -49], [-20, 0.1, -51]
      ], sandRim, sandEdge, 5);

      // South Islet L1 Stage Platform (-2, -45)
      drawPolyWorld([
        [-12, 0.2, -50], [10, 0.2, -50], [10, 1.4, -39], [-12, 1.4, -39]
      ], "#B89A74", null, 0);
      drawPolyWorld([
        [-12, 1.4, -50], [10, 1.4, -50], [10, 1.4, -39], [-12, 1.4, -39]
      ], state.timeSlot === "night" ? "#698B68" : "#B7DDA8", "#93C794", 2);

      // L-0.5 East Tidepool Recession
      drawPolyWorld([
        [29, -0.25, -31], [43, -0.25, -31], [43, -0.25, -21], [29, -0.25, -21]
      ], "#6ED3CE", "#FFF5E4", 2.5);

      // L1 Core & Wings Grass Plateau (+1.8m)
      const grass1 = state.timeSlot === "night" ? "#6D946C" : "#B7DDA8";
      const cliff1 = "#D4A878";
      // South cliff face L0 -> L1
      drawPolyWorld([
        [-61, 0.1, -14], [61, 0.1, -14], [61, 1.8, -14], [-61, 1.8, -14]
      ], cliff1, null, 0);
      drawPolyWorld([
        [-61, 1.8, -14], [61, 1.8, -14], [61, 1.8, 30], [-61, 1.8, 30]
      ], grass1, "#8CB889", 2);

      // L2 North & Wing Terraces (+3.6m)
      const grass2 = state.timeSlot === "night" ? "#5A7D5B" : "#93C794";
      const cliff2 = "#BA8F64";
      // Core North L2 + North Valley L2
      drawPolyWorld([
        [-50, 1.8, 14], [50, 1.8, 14], [50, 3.6, 14], [-50, 3.6, 14]
      ], cliff2, null, 0);
      drawPolyWorld([
        [-50, 3.6, 14], [50, 3.6, 14], [50, 3.6, 62], [-50, 3.6, 62]
      ], grass2, "#76AA79", 2);

      // West Cape L2 ridge (-58..-43, -20..-6)
      drawPolyWorld([
        [-58, 1.8, -20], [-43, 1.8, -20], [-43, 3.6, -20], [-58, 3.6, -20]
      ], cliff2, null, 0);
      drawPolyWorld([
        [-58, 3.6, -20], [-43, 3.6, -20], [-43, 3.6, -6], [-58, 3.6, -6]
      ], grass2, "#76AA79", 2);

      // West NW Cottages L2 (-62..-41, 12..30)
      drawPolyWorld([
        [-62, 1.8, 12], [-41, 1.8, 12], [-41, 3.6, 12], [-62, 3.6, 12]
      ], cliff2, null, 0);
      drawPolyWorld([
        [-62, 3.6, 12], [-41, 3.6, 12], [-41, 3.6, 30], [-62, 3.6, 30]
      ], grass2, "#76AA79", 2);

      // L3 Twin Peaks (+5.4m)
      // 1) West Cape Lighthouse Cliff (-56, -24) with clean north grass slope
      drawPolyWorld([
        [-64, 1.8, -32], [-48, 1.8, -32], [-48, 5.4, -32], [-64, 5.4, -32]
      ], "#B99A7B", null, 0);
      drawPolyWorld([
        [-64, 5.4, -32], [-48, 5.4, -32], [-48, 5.4, -18], [-64, 5.4, -18]
      ], "#88BC8B", "#6F9E72", 2);
      // 2) North Camphor Peak (0, +58)
      drawPolyWorld([
        [-12, 3.6, 51], [12, 3.6, 51], [12, 5.4, 51], [-12, 5.4, 51]
      ], "#B99A7B", null, 0);
      drawPolyWorld([
        [-12, 5.4, 51], [12, 5.4, 51], [12, 5.4, 65], [-12, 5.4, 65]
      ], "#88BC8B", "#6F9E72", 2);

      // Firefly Creek (F32) winding stream across Zone N
      ctx.save();
      ctx.strokeStyle = state.timeSlot === "night" ? "#4F94B8" : "#7CC6E8";
      ctx.lineWidth = Math.max(8, 3.2 * camZoom);
      ctx.lineCap = "round";
      ctx.beginPath();
      const creekPts = [[-8, 3.2, 36], [2, 3.2, 34], [12, 3.2, 36], [24, 3.2, 34], [35, 3.2, 38]];
      creekPts.forEach(([x, y, z], i) => {
        const p = worldToScreen(x, y, z);
        if (i === 0) ctx.moveTo(p.sx, p.sy);
        else ctx.lineTo(p.sx, p.sy);
      });
      ctx.stroke();
      ctx.restore();

      // Stone Walkways & Loops (130m Core Loop + 385m Outer Loop)
      const drawPath = (pts, col, wM) => {
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(4, wM * camZoom);
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath();
        pts.forEach(([x, y, z], i) => {
          const p = worldToScreen(x, y, z);
          if (i === 0) ctx.moveTo(p.sx, p.sy);
          else ctx.lineTo(p.sx, p.sy);
        });
        ctx.stroke();
        ctx.restore();
      };
      const pathCol = state.timeSlot === "night" ? "rgba(229,215,193,0.45)" : "rgba(255,245,228,0.82)";
      // Core Inner Loop
      drawPath([
        [-6, 0.2, -20], [-6, 1.8, -11], [14, 1.8, -10], [14, 1.8, 5],
        [14, 3.6, 17], [-12, 3.6, 17], [-22, 1.8, 4], [-22, 1.8, -6], [-6, 1.8, -11]
      ], pathCol, 2.2);
      // Outer Bay-Mountain Loop
      drawPath([
        [-22, 1.8, 4], [-44, 1.8, 4], [-38, 1.8, -8], [-50, 3.6, -14], [-56, 5.4, -24],
        [-42, 0.3, -30], [-28, 1.0, -35], [-2, 1.4, -45], [22, 0.15, -36],
        [36, -0.25, -26], [52, 0.2, -32], [54, 1.2, -18], [44, 1.8, -4], [48, 3.6, 14],
        [26, 3.6, 42], [0, 5.4, 58], [-16, 3.6, 42], [-36, 4.2, 46], [-48, 3.6, 20], [-44, 1.8, 4]
      ], pathCol, 1.8);

      // Ramps (L0<->L1, L1<->L2)
      [
        { x: -6, z: -14, y: 1.0 }, { x: 10, z: -14, y: 1.0 },
        { x: -16, z: 14, y: 2.7 }, { x: 16, z: 14, y: 2.7 },
        { x: -38, z: -14, y: 2.7 }, { x: 42, z: 10, y: 2.7 }
      ].forEach(rp => {
        const p = worldToScreen(rp.x, rp.y, rp.z);
        ctx.fillStyle = "#E4BA8B";
        rRect(ctx, p.sx - 2.2 * camZoom, p.sy - 1.2 * camZoom, 4.4 * camZoom, 2.4 * camZoom, 4);
        ctx.fill();
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.2; ctx.stroke();
      });

      // Downhill Slide Chutes (F35W & F35E)
      const slideSub = DB.facilities.find(f => f.id === "F35").subAnchors;
      slideSub.forEach(s => {
        const p1 = worldToScreen(s.pos[0], s.pos[1], s.pos[2]);
        const p2 = worldToScreen(s.exitPos[0], s.exitPos[1], s.exitPos[2]);
        ctx.save();
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = Math.max(7, 1.9 * camZoom); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.quadraticCurveTo((p1.sx + p2.sx) / 2, p1.sy + 20, p2.sx, p2.sy); ctx.stroke();
        ctx.strokeStyle = "#E4BA8B"; ctx.lineWidth = Math.max(4, 1.2 * camZoom);
        ctx.beginPath(); ctx.moveTo(p1.sx, p1.sy); ctx.quadraticCurveTo((p1.sx + p2.sx) / 2, p1.sy + 20, p2.sx, p2.sy); ctx.stroke();
        ctx.restore();
      });

      // Ferry route dotted arc
      const pf1 = worldToScreen(-6, 0.2, -22);
      const pf40 = worldToScreen(-5, 0.2, -36);
      const pf26 = worldToScreen(48, 0.2, -24);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(255, 245, 228, 0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pf1.sx, pf1.sy); ctx.lineTo(pf40.sx, pf40.sy);
      ctx.quadraticCurveTo((pf40.sx + pf26.sx) / 2, pf40.sy + 18, pf26.sx, pf26.sy);
      ctx.stroke();
      ctx.restore();
    }

    function drawFlagCanvasIcon(px, py, sizePx, tSec) {
      const cell = sizePx / 12;
      const str = state.pixelFlag12x12;
      for (let r = 0; r < 12; r++) {
        const wave = Math.sin(tSec * 4 + r * 0.4) * 1.3;
        for (let c = 0; c < 12; c++) {
          const code = parseInt(str[r * 12 + c] || "0", 10);
          ctx.fillStyle = PIXEL_PALETTE[code] || "#FFF5E4";
          ctx.fillRect(px + c * cell, py + r * cell + wave * (c / 12), cell + 0.5, cell + 0.5);
        }
      }
    }

    function drawFacilityVisual(fac, tSec) {
      const p = worldToScreen(fac.pos[0], fac.pos[1], fac.pos[2]);
      const s = camZoom;
      const locked = !isFacilityUnlocked(fac);
      ctx.save();
      if (locked) ctx.globalAlpha = 0.48;

      // Ground shadow
      ctx.fillStyle = "rgba(90, 88, 125, 0.22)";
      ctx.beginPath();
      ctx.ellipse(p.sx + 0.4 * s, p.sy + 0.3 * s, Math.max(12, fac.size[0] * 0.45 * s), Math.max(8, fac.size[1] * 0.35 * s), 0, 0, Math.PI * 2);
      ctx.fill();

      const id = fac.id;
      if (id === "F04" || id === "F19" || id === "F13" || id === "F13b" || id === "F13c" || id === "F23" || id === "F23b" || id === "F30" || id === "F30b") {
        // Storybook Cottage
        const bw = (id === "F19" ? 4.4 : id === "F04" ? 4.2 : 3.2) * s;
        const bh = (id === "F04" ? 2.5 : 2.1) * s;
        const wallCol = (id === "F30" || id === "F30b") ? "#F2D88F" : id === "F13b" ? "#B7C69B" : id === "F19" ? "#FFF5E4" : "#F6E7D1";
        const roofCol = (id === "F23" || id === "F23b" || id === "F13c") ? "#638A9E" : id === "F13b" ? "#65765F" : (id === "F30" || id === "F30b") ? "#89B7A2" : "#B96A59";
        // Walls
        ctx.fillStyle = wallCol;
        rRect(ctx, p.sx - bw / 2, p.sy - bh, bw, bh, 5);
        ctx.fill(); ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.6; ctx.stroke();
        // Roof
        ctx.fillStyle = roofCol;
        ctx.beginPath();
        ctx.moveTo(p.sx - bw * 0.62, p.sy - bh + 2);
        ctx.lineTo(p.sx, p.sy - bh - bh * 0.72);
        ctx.lineTo(p.sx + bw * 0.62, p.sy - bh + 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Door
        ctx.fillStyle = id === "F19" ? "#7EC8B5" : "#9D623E";
        rRect(ctx, p.sx - bw * 0.14, p.sy - bh * 0.56, bw * 0.28, bh * 0.56, 4);
        ctx.fill();
        // Warm Windows (GI glow at dusk/night)
        const warmWin = state.timeSlot !== "afternoon";
        ctx.fillStyle = warmWin ? "#FFD67A" : "#CBEAF7";
        rRect(ctx, p.sx - bw * 0.36, p.sy - bh * 0.62, bw * 0.18, bh * 0.26, 3); ctx.fill();
        rRect(ctx, p.sx + bw * 0.18, p.sy - bh * 0.62, bw * 0.18, bh * 0.26, 3); ctx.fill();
      } else if (id === "F31") {
        // Memory Conservatory Glass Greenhouse
        const bw = 5.4 * s, bh = 2.8 * s;
        ctx.fillStyle = "#B8B1A6"; // dwarf stone wall
        rRect(ctx, p.sx - bw / 2, p.sy - bh * 0.35, bw, bh * 0.35, 4); ctx.fill();
        // Glass dome
        ctx.fillStyle = state.timeSlot === "afternoon" ? "rgba(166, 232, 224, 0.76)" : "rgba(255, 223, 145, 0.82)";
        ctx.beginPath();
        ctx.arc(p.sx, p.sy - bh * 0.35, bw * 0.48, Math.PI, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#E4BA8B"; ctx.lineWidth = 2.4; ctx.stroke();
        // Arch ribs
        ctx.beginPath(); ctx.moveTo(p.sx, p.sy - bh * 0.35 - bw * 0.48); ctx.lineTo(p.sx, p.sy); ctx.stroke();
      } else if (id === "F22") {
        // West Cape Lighthouse
        const r = 1.9 * s, h = 6.8 * s;
        ctx.fillStyle = "#FFF5E4";
        ctx.beginPath();
        ctx.moveTo(p.sx - r, p.sy); ctx.lineTo(p.sx - r * 0.65, p.sy - h);
        ctx.lineTo(p.sx + r * 0.65, p.sy - h); ctx.lineTo(p.sx + r, p.sy);
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.6; ctx.stroke();
        // Red stripes
        ctx.fillStyle = "#B96A59";
        ctx.fillRect(p.sx - r * 0.85, p.sy - h * 0.45, r * 1.7, h * 0.16);
        ctx.fillRect(p.sx - r * 0.72, p.sy - h * 0.8, r * 1.44, h * 0.14);
        // Lantern room
        const lit = state.events.includes("lighthouse_relight") || state.freeRoamMode || state.timeSlot !== "afternoon";
        ctx.fillStyle = lit ? "#FFD67A" : "#94A3B8";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - h - 0.5 * s, r * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#B96A59";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - h - 0.9 * s, r * 0.7, Math.PI, 0); ctx.fill();
      } else if (id === "F15") {
        // Octagonal Windmill
        const w = 2.6 * s, h = 5.0 * s;
        ctx.fillStyle = "#E4BA8B";
        ctx.beginPath();
        ctx.moveTo(p.sx - w * 0.6, p.sy); ctx.lineTo(p.sx - w * 0.38, p.sy - h);
        ctx.lineTo(p.sx + w * 0.38, p.sy - h); ctx.lineTo(p.sx + w * 0.6, p.sy);
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = "#B96A59";
        ctx.beginPath(); ctx.moveTo(p.sx - w * 0.46, p.sy - h); ctx.lineTo(p.sx, p.sy - h - 1.3 * s); ctx.lineTo(p.sx + w * 0.46, p.sy - h); ctx.closePath(); ctx.fill();
        // Rotating sails
        ctx.save();
        ctx.translate(p.sx, p.sy - h + 0.3 * s);
        ctx.rotate(tSec * 0.7);
        for (let k = 0; k < 4; k++) {
          ctx.rotate(Math.PI / 2);
          ctx.fillStyle = "#FFF5E4"; ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.2;
          ctx.fillRect(0, -0.25 * s, 2.7 * s, 0.55 * s);
          ctx.strokeRect(0, -0.25 * s, 2.7 * s, 0.55 * s);
        }
        ctx.restore();
      } else if (id === "F27") {
        // Daylight Lightship
        const bw = 5.4 * s;
        ctx.save(); ctx.translate(p.sx, p.sy); ctx.rotate(-0.08);
        ctx.fillStyle = "#7CC6E8"; ctx.strokeStyle = "#5A587D"; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-bw * 0.52, -1.0 * s); ctx.lineTo(bw * 0.52, -1.0 * s);
        ctx.lineTo(bw * 0.36, 0.3 * s); ctx.lineTo(-bw * 0.36, 0.3 * s); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#FFF5E4"; ctx.fillRect(-bw * 0.25, -1.9 * s, bw * 0.42, 0.9 * s);
        // Mast + glowing beacon
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, -1.0 * s); ctx.lineTo(0, -5.2 * s); ctx.stroke();
        ctx.fillStyle = (state.events.includes("lightship_relight") || state.freeRoamMode) ? "#FFD67A" : "#CBD5E1";
        ctx.beginPath(); ctx.arc(0, -5.3 * s, 0.65 * s, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (id === "F34") {
        // Ancient Camphor Tree + Bell Pavilion
        ctx.fillStyle = "#E4BA8B";
        ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 4.6 * s, 2.6 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.fillStyle = "#9D623E"; ctx.fillRect(p.sx - 0.7 * s, p.sy - 4.2 * s, 1.4 * s, 4.2 * s);
        [[-1.6, -4.6, 2.0], [1.6, -4.5, 2.0], [0, -5.8, 2.6]].forEach(([ox, oy, rr]) => {
          ctx.fillStyle = "#93C794";
          ctx.beginPath(); ctx.arc(p.sx + ox * s, p.sy + oy * s, rr * s, 0, Math.PI * 2); ctx.fill();
        });
        // Bronze Bell
        ctx.fillStyle = "#D9A441";
        ctx.beginPath(); ctx.arc(p.sx + 2.8 * s, p.sy - 2.1 * s, 0.65 * s, 0, Math.PI * 2); ctx.fill();
      } else if (id === "F39") {
        // Driftwood Echo Arch
        ctx.fillStyle = "#E4BA8B";
        ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 4.2 * s, 2.2 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#C79C6E"; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(p.sx, p.sy - 0.5 * s, 3.3 * s, Math.PI, 0); ctx.stroke();
        // Hanging shell chimes
        for (let i = -2; i <= 2; i++) {
          const cx = p.sx + i * 0.95 * s;
          const sway = Math.sin(tSec * 2.5 + i) * 3;
          ctx.strokeStyle = "#FFF5E4"; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(cx, p.sy - 3.3 * s); ctx.lineTo(cx + sway, p.sy - 2.0 * s); ctx.stroke();
          ctx.fillStyle = i % 2 === 0 ? "#F472B6" : "#7CC6E8";
          ctx.beginPath(); ctx.arc(cx + sway, p.sy - 1.9 * s, 0.28 * s, 0, Math.PI * 2); ctx.fill();
        }
      } else if (id === "F07" || id === "F21") {
        // Pixel Flagpole or Windchime Corridor with live 12x12 pixel flag!
        if (id === "F21") {
          ctx.fillStyle = "#E4BA8B"; rRect(ctx, p.sx - 2.8 * s, p.sy - 0.5 * s, 5.6 * s, 1.0 * s, 4); ctx.fill();
          ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(p.sx - 2.2 * s, p.sy); ctx.lineTo(p.sx - 2.2 * s, p.sy - 2.2 * s);
          ctx.lineTo(p.sx + 2.2 * s, p.sy - 2.2 * s); ctx.lineTo(p.sx + 2.2 * s, p.sy); ctx.stroke();
        }
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx, p.sy - 3.6 * s); ctx.stroke();
        drawFlagCanvasIcon(p.sx + 2, p.sy - 3.5 * s, 1.7 * s, tSec);
      } else if (id === "F06") {
        // Mendel Raised Flowerbed
        ctx.fillStyle = "#9D623E";
        rRect(ctx, p.sx - 2.6 * s, p.sy - 1.0 * s, 5.2 * s, 1.8 * s, 5); ctx.fill();
        ctx.fillStyle = "#6B442A";
        rRect(ctx, p.sx - 2.3 * s, p.sy - 0.8 * s, 4.6 * s, 1.3 * s, 4); ctx.fill();
        state.mendelBed.slice(0, 6).forEach((fl, i) => {
          const fx = p.sx - 1.7 * s + (i % 3) * 1.6 * s;
          const fz = p.sy - 0.4 * s + Math.floor(i / 3) * 0.65 * s;
          ctx.fillStyle = fl.color;
          ctx.beginPath(); ctx.arc(fx, fz, 0.38 * s, 0, Math.PI * 2); ctx.fill();
        });
      } else if (id === "F09") {
        // Central Wish Fountain
        ctx.fillStyle = "#B8B1A6";
        ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 2.8 * s, 1.8 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#7CC6E8";
        ctx.beginPath(); ctx.ellipse(p.sx, p.sy - 0.1 * s, 2.2 * s, 1.3 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#D4CEC3";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - 1.0 * s, 0.7 * s, 0, Math.PI * 2); ctx.fill();
      } else if (id === "F25") {
        // Night Market Bakery Kiln & String Lights
        ctx.fillStyle = "#B96A59";
        ctx.beginPath(); ctx.arc(p.sx - 1.4 * s, p.sy - 0.6 * s, 1.5 * s, Math.PI, 0); ctx.fill();
        ctx.fillRect(p.sx - 2.9 * s, p.sy - 0.6 * s, 3.0 * s, 0.8 * s);
        ctx.fillStyle = "#FFD67A";
        ctx.beginPath(); ctx.arc(p.sx - 1.4 * s, p.sy - 0.3 * s, 0.5 * s, Math.PI, 0); ctx.fill();
        // Stall + String lights
        ctx.fillStyle = "#E4BA8B"; rRect(ctx, p.sx + 0.5 * s, p.sy - 1.4 * s, 3.0 * s, 1.5 * s, 4); ctx.fill();
        ctx.fillStyle = "#F5E6C8"; rRect(ctx, p.sx + 0.3 * s, p.sy - 2.0 * s, 3.4 * s, 0.7 * s, 3); ctx.fill();
        for (let b = 0; b < 5; b++) {
          ctx.fillStyle = "#FFD67A";
          ctx.beginPath(); ctx.arc(p.sx - 2.0 * s + b * 1.2 * s, p.sy - 2.4 * s + Math.sin(b) * 3, 0.22 * s, 0, Math.PI * 2); ctx.fill();
        }
      } else if (id === "F33") {
        // Forest Watermill with spinning paddle wheel
        ctx.fillStyle = "#FFF5E4"; rRect(ctx, p.sx - 1.8 * s, p.sy - 2.0 * s, 3.6 * s, 2.0 * s, 4); ctx.fill();
        ctx.fillStyle = "#B96A59";
        ctx.beginPath(); ctx.moveTo(p.sx - 2.2 * s, p.sy - 2.0 * s); ctx.lineTo(p.sx, p.sy - 3.5 * s); ctx.lineTo(p.sx + 2.2 * s, p.sy - 2.0 * s); ctx.closePath(); ctx.fill();
        ctx.save(); ctx.translate(p.sx + 2.1 * s, p.sy - 0.7 * s); ctx.rotate(tSec * 1.4);
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 1.0 * s, 0, Math.PI * 2); ctx.stroke();
        for (let k = 0; k < 6; k++) {
          ctx.rotate(Math.PI / 3);
          ctx.beginPath(); ctx.moveTo(-1.0 * s, 0); ctx.lineTo(1.0 * s, 0); ctx.stroke();
        }
        ctx.restore();
      } else if (id === "F37" || id === "F32" || id === "F32W" || id === "F32E") {
        // Wooden Arch Bridge
        const bw = (id === "F37" ? 8.5 : 4.2) * s;
        ctx.fillStyle = "#E4BA8B"; ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.sx - bw / 2, p.sy + 0.4 * s);
        ctx.quadraticCurveTo(p.sx, p.sy - 1.4 * s, p.sx + bw / 2, p.sy + 0.4 * s);
        ctx.lineTo(p.sx + bw / 2, p.sy + 1.0 * s);
        ctx.quadraticCurveTo(p.sx, p.sy - 0.7 * s, p.sx - bw / 2, p.sy + 1.0 * s);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (id === "F38") {
        // Tidal Basalt Stepping Stones
        for (let i = -2; i <= 2; i++) {
          ctx.fillStyle = "#7B828E";
          ctx.beginPath(); ctx.ellipse(p.sx + i * 1.9 * s, p.sy, 0.85 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#93C794"; ctx.lineWidth = 1.5; ctx.stroke();
        }
      } else if (id === "F40") {
        // Wooden Ferry Rowboat
        const bob = Math.sin(tSec * 2.4) * 3;
        ctx.fillStyle = "#7CC6E8"; ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(p.sx, p.sy + bob, 1.8 * s, 0.8 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#FFD67A"; ctx.beginPath(); ctx.arc(p.sx + 1.3 * s, p.sy - 0.9 * s + bob, 0.25 * s, 0, Math.PI * 2); ctx.fill();
      } else if (id === "F41") {
        // Drift Book Phonebooth
        ctx.fillStyle = "#7EC8B5"; rRect(ctx, p.sx - 0.9 * s, p.sy - 2.3 * s, 1.8 * s, 2.3 * s, 4); ctx.fill();
        ctx.fillStyle = "#FFD67A"; rRect(ctx, p.sx - 0.55 * s, p.sy - 1.9 * s, 1.1 * s, 1.1 * s, 2); ctx.fill();
        ctx.fillStyle = "#B96A59";
        ctx.beginPath(); ctx.moveTo(p.sx - 1.1 * s, p.sy - 2.3 * s); ctx.lineTo(p.sx, p.sy - 3.0 * s); ctx.lineTo(p.sx + 1.1 * s, p.sy - 2.3 * s); ctx.closePath(); ctx.fill();
      } else if (id === "F42") {
        drawBikeStopAt(fac.pos[0], fac.pos[1], fac.pos[2]);
      } else if (id === "F24") {
        // Campfire
        ctx.fillStyle = "#9D623E"; rRect(ctx, p.sx - 0.9 * s, p.sy - 0.3 * s, 1.8 * s, 0.6 * s, 3); ctx.fill();
        const fl = 0.8 + Math.sin(tSec * 8) * 0.15;
        ctx.fillStyle = "#FF8C42";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - 0.5 * s * fl, 0.7 * s * fl, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFD67A";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - 0.4 * s, 0.4 * s, 0, Math.PI * 2); ctx.fill();
      } else {
        // Stylish fallback wooden kiosk / bench / dock / arch
        const bw = Math.min(4.2, Math.max(1.8, fac.size[0] * 0.55)) * s;
        const bh = Math.min(2.4, Math.max(0.9, fac.size[2] * 0.45)) * s;
        ctx.fillStyle = id === "F08" ? "#46455E" : id === "F10" ? "#F4A9B8" : "#E4BA8B";
        rRect(ctx, p.sx - bw / 2, p.sy - bh, bw, bh, 5);
        ctx.fill(); ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 1.5; ctx.stroke();
      }

      // Facility Name Tag
      if (camZoom >= 12) {
        const labelTxt = `${fac.id} ${fac.name.slice(0, 7)}`;
        ctx.font = "bold 10.5px sans-serif";
        const tw = ctx.measureText(labelTxt).width + 10;
        ctx.fillStyle = locked ? "rgba(90,88,125,0.72)" : "rgba(255,248,235,0.88)";
        rRect(ctx, p.sx - tw / 2, p.sy + 5, tw, 16, 6); ctx.fill();
        ctx.fillStyle = locked ? "#FFF5E4" : "#46455E";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(labelTxt, p.sx, p.sy + 13);
      }
      ctx.restore();
    }

    function drawBikeStopAt(wx, wy, wz) {
      const p = worldToScreen(wx, wy, wz);
      const s = camZoom;
      ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx, p.sy - 2.1 * s); ctx.stroke();
      ctx.fillStyle = "#7EC8B5"; ctx.beginPath(); ctx.arc(p.sx, p.sy - 2.2 * s, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      // Cute Mint Bike beside pole
      ctx.strokeStyle = "#48A999"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.sx + 0.7 * s, p.sy - 0.3 * s, 0.35 * s, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.sx + 1.6 * s, p.sy - 0.3 * s, 0.35 * s, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.sx + 0.7 * s, p.sy - 0.3 * s); ctx.lineTo(p.sx + 1.2 * s, p.sy - 0.8 * s); ctx.lineTo(p.sx + 1.6 * s, p.sy - 0.3 * s); ctx.stroke();
    }

    function drawMicroProp(mp, tSec) {
      const y = getElevationAt(mp.x, mp.z);
      const p = worldToScreen(mp.x, y, mp.z);
      const s = camZoom;
      if (mp.kind === "lamp") {
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx, p.sy - 1.5 * s); ctx.stroke();
        ctx.fillStyle = state.timeSlot !== "afternoon" ? "#FFD67A" : "#FFF5E4";
        ctx.beginPath(); ctx.arc(p.sx, p.sy - 1.6 * s, 0.35 * s, 0, Math.PI * 2); ctx.fill();
      } else if (mp.kind === "sign") {
        const straight = state.stats.straightSignIds.includes(mp.id);
        ctx.save(); ctx.translate(p.sx, p.sy);
        ctx.rotate(straight ? 0 : 0.14);
        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -1.5 * s); ctx.stroke();
        ctx.fillStyle = "#E4BA8B"; rRect(ctx, -0.7 * s, -1.5 * s, 1.4 * s, 0.45 * s, 2); ctx.fill();
        ctx.restore();
      } else if (mp.kind === "pine" || mp.kind === "maple" || mp.kind === "fruit") {
        ctx.fillStyle = "#9D623E"; ctx.fillRect(p.sx - 0.28 * s, p.sy - 1.6 * s, 0.56 * s, 1.6 * s);
        const col = mp.kind === "pine" ? "#7BB59D" : mp.kind === "maple" ? "#E8C37D" : "#93C794";
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy - 2.6 * s, 1.25 * s, 0, Math.PI * 2);
        ctx.arc(p.sx - 0.85 * s, p.sy - 2.0 * s, 0.9 * s, 0, Math.PI * 2);
        ctx.arc(p.sx + 0.85 * s, p.sy - 2.0 * s, 0.9 * s, 0, Math.PI * 2);
        ctx.fill();
        if (mp.kind === "fruit") {
          ctx.fillStyle = "#F4847A";
          [[-0.5, -2.8], [0.5, -2.5], [0, -1.8]].forEach(([ox, oy]) => {
            ctx.beginPath(); ctx.arc(p.sx + ox * s, p.sy + oy * s, 0.22 * s, 0, Math.PI * 2); ctx.fill();
          });
        }
      } else if (mp.kind === "chime") {
        ctx.strokeStyle = "#C79C6E"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.sx, p.sy); ctx.lineTo(p.sx, p.sy - 1.8 * s); ctx.stroke();
        ctx.fillStyle = "#7CC6E8"; ctx.beginPath(); ctx.arc(p.sx + Math.sin(tSec * 3) * 2, p.sy - 1.4 * s, 0.25 * s, 0, Math.PI * 2); ctx.fill();
      }
    }

    function sampleResidentPose(ch) {
      const pose = { lift: 0, tilt: 0, head: 0, width: 1, height: 1, shift: 0, left: 0, right: 0, step: 0 };
      const a = ch.actionAnim;
      if (!a) return pose;
      const style = RESIDENT_MOTION[ch.id];
      const t = a.t / a.dur;
      const ease = Math.sin(Math.PI * t) ** 1.5;
      const beat = Math.sin(Math.PI * 2 * style.beats * t);
      const pulse = (1 - Math.cos(Math.PI * 2 * style.beats * t)) / 2;
      const lead = style.lead;
      const paw = lead < 0 ? "left" : "right";
      const bounce = pulse * ease * style.energy;

      switch (a.type) {
        case "greet":
        case "wave":
          pose[paw] = lead * (2.15 + beat * 0.34) * ease;
          pose.head = lead * style.lean * ease;
          pose.lift = ch.id === "C07" ? bounce * 0.18 : 0;
          break;
        case "turn_to_player":
        case "pivot_spin":
          pose.width = 1 - Math.abs(Math.sin(Math.PI * (a.type === "pivot_spin" ? 2 : 1) * t)) * 0.45;
          pose.tilt = lead * style.lean * Math.sin(Math.PI * 2 * t);
          pose.shift = lead * 0.17 * ease;
          break;
        case "nod_tilt":
          pose.head = lead * style.lean * ease;
          pose.height = 1 - bounce * 0.13;
          if (ch.id === "C02" || ch.id === "C09") {
            pose.left = 0.58 * ease;
            pose.right = -pose.left;
          }
          break;
        case "clap":
          pose.left = (0.50 + 0.85 * pulse) * ease;
          pose.right = -pose.left;
          pose.head = lead * style.lean * ease;
          pose.lift = ch.id === "C03" ? 0 : bounce * 0.16;
          break;
        case "cheer":
        case "hop_bounce":
          pose.lift = bounce * 0.64;
          pose.height = 1 - 0.12 * ease + 0.22 * bounce;
          pose.width = 2 - pose.height;
          pose.left = -2.35 * ease;
          pose.right = -pose.left;
          break;
        case "dance":
          pose.shift = beat * ease * 0.23;
          pose.tilt = beat * ease * style.lean;
          pose.left = -(0.95 + beat * 0.55) * ease;
          pose.right = (0.95 - beat * 0.55) * ease;
          pose.step = beat * ease * 0.25;
          break;
        case "hover_bob":
          pose.lift = bounce * 0.42;
          pose.left = -0.75 * ease;
          pose.right = -pose.left;
          pose.tilt = lead * style.lean * 0.6 * ease;
          break;
        case "paper_pet_squash":
          pose.width = 1 + beat * ease * 0.24;
          pose.height = 2 - pose.width;
          break;
        case "sit":
          pose.height = 1 - 0.25 * ease;
          pose.width = 1 + 0.09 * ease;
          pose.head = lead * style.lean * ease;
          break;
        case "water_bend":
          pose.tilt = lead * 0.31 * ease;
          pose[paw] = lead * 1.05 * ease;
          pose.height = 1 - 0.12 * ease;
          break;
        case "photo":
          pose.head = lead * style.lean * ease;
          pose[paw] = lead * 1.46 * ease;
          pose.shift = lead * 0.14 * ease;
          break;
        case "walk":
        case "run":
          pose.step = beat * ease * (a.type === "run" ? 0.45 : 0.26);
          pose.left = pose.step * 2;
          pose.right = -pose.left;
          pose.lift = bounce * 0.20;
          break;
      }
      return pose;
    }

    function drawChibiCharacter(ch, isPlayer, tSec) {
      const p = worldToScreen(ch.x, ch.y, ch.z);
      const s = camZoom;
      const r = 0.56 * s;
      const pose = sampleResidentPose(ch);
      let bobY = -pose.lift * r;

      if (!isPlayer && ch.id === "C05") {
        bobY -= 0.35 * s + Math.sin(tSec * 3.5) * 4;
      }
      if (isPlayer) {
        if (Math.hypot(player.vx, player.vz) > 0.1 || player.sliding) bobY -= Math.abs(Math.sin(player.walkPhase)) * 4;
      } else if (ch.state === "wander" || ch.state === "director_approach") {
        bobY -= Math.abs(Math.sin(ch.walkPhase)) * 3.5;
      }

      if (!isPlayer && ch.state === "dragged") {
        bobY -= 16; pose.width = 0.92; pose.height = 1.12;
      }

      // Shadow
      ctx.fillStyle = "rgba(90, 88, 125, 0.28)";
      ctx.beginPath(); ctx.ellipse(p.sx, p.sy + 2, 0.65 * s, 0.3 * s, 0, 0, Math.PI * 2); ctx.fill();

      drawChibiPose(ctx, ch, isPlayer, r, pose, p.sx, p.sy + bobY);

      // Nameplate
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = state.timeSlot === "night" ? "#FFF5E4" : "#46455E";
      const label = isPlayer ? "我 (旅人)" : ch.name;
      ctx.fillText(label, p.sx, p.sy + 14);

      // Worry Bubble & Stage Star above NPC
      if (!isPlayer) {
        drawResidentBubbles(ch, p, r, bobY, tSec);
      }
    }

    function drawChibiPose(ctx, ch, isPlayer, r, pose, x, y) {
      ctx.save();
      ctx.translate(x + pose.shift * r, y);
      ctx.rotate(pose.tilt);
      ctx.scale(pose.width, pose.height);
      const pal = isPlayer
        ? { body: "#FFD67A", ear: "#E4BA8B", accent: "#B96A59", muzzle: "#FFF5E4" }
        : (CHAR_COLORS[ch.id] || CHAR_COLORS.C01);

      // Body
      ctx.fillStyle = pal.accent;
      rRect(ctx, -r * 0.72, -r * 1.15, r * 1.44, r * 1.05, 6); ctx.fill();
      if (!isPlayer) {
        ctx.strokeStyle = pal.body;
        ctx.lineCap = "round";
        ctx.lineWidth = r * 0.33;
        for (const side of [-1, 1]) {
          const angle = side < 0 ? pose.left : pose.right;
          ctx.beginPath();
          ctx.moveTo(side * r * 0.62, -r * 0.82);
          ctx.lineTo(r * (side * 0.62 + Math.sin(angle) * 0.63), r * (-0.82 + Math.cos(angle) * 0.63));
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(side * r * 0.39, -r * 0.28);
          ctx.lineTo(side * r * 0.43, r * Math.min(0, side * pose.step));
          ctx.stroke();
        }
      }
      ctx.translate(0, -r * 1.14);
      ctx.rotate(pose.head);
      ctx.translate(0, r * 1.14);
      // Ears
      ctx.fillStyle = pal.ear;
      if (!isPlayer && ch.id === "C02") { // lop ears
        ctx.beginPath(); ctx.ellipse(-r * 0.9, -r * 1.45, r * 0.25, r * 0.6, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(r * 0.9, -r * 1.45, r * 0.25, r * 0.6, -0.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(-r * 0.68, -r * 2.15, r * 0.34, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(r * 0.68, -r * 2.15, r * 0.34, 0, Math.PI * 2); ctx.fill();
      }
      // Head
      ctx.fillStyle = pal.body;
      ctx.beginPath(); ctx.arc(0, -r * 1.65, r * 0.95, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(70,69,94,0.3)"; ctx.lineWidth = 1.2; ctx.stroke();

      // Hat/Glasses/Beret accents
      if (isPlayer) {
        ctx.fillStyle = "#B96A59"; // cozy traveler beret
        ctx.beginPath(); ctx.ellipse(0, -r * 2.45, r * 0.72, r * 0.26, -0.1, 0, Math.PI * 2); ctx.fill();
      } else if (ch.id === "C03" || ch.id === "C09") {
        ctx.fillStyle = ch.id === "C03" ? "#9D623E" : "#F4847A";
        ctx.beginPath(); ctx.ellipse(r * 0.15, -r * 2.45, r * 0.68, r * 0.24, 0.15, 0, Math.PI * 2); ctx.fill();
      } else if (ch.id === "C06") {
        ctx.fillStyle = "#E9C46A";
        ctx.beginPath(); ctx.ellipse(0, -r * 2.35, r * 1.25, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
      } else if (ch.id === "C07") {
        ctx.fillStyle = "#7CC6E8";
        ctx.beginPath(); ctx.ellipse(0, -r * 2.42, r * 0.75, r * 0.26, -0.1, 0, Math.PI * 2); ctx.fill();
      }

      // Muzzle & Eyes
      ctx.fillStyle = pal.muzzle;
      ctx.beginPath(); ctx.ellipse(0, -r * 1.4, r * 0.42, r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2E2D40";
      if (!isPlayer && ch.id === "C03") {
        // Deadpan half-lidded eyes
        ctx.fillRect(-r * 0.52, -r * 1.75, r * 0.32, 2.2);
        ctx.fillRect(r * 0.2, -r * 1.75, r * 0.32, 2.2);
      } else {
        ctx.beginPath(); ctx.arc(-r * 0.36, -r * 1.7, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(r * 0.36, -r * 1.7, 2.2, 0, Math.PI * 2); ctx.fill();
      }
      if (!isPlayer && ch.id === "C01") {
        ctx.strokeStyle = "#46455E"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(-r * 0.36, -r * 1.7, r * 0.26, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(r * 0.36, -r * 1.7, r * 0.26, 0, Math.PI * 2); ctx.stroke();
      }

      ctx.restore();
    }

    function drawResidentBubbles(ch, p, r, bobY, tSec) {
        const st = state.charStages[ch.id] || 0;
        if (st < 3 && ch.ms) {
          const chk = checkConditionMet(ch, ch.ms.scripts[st]);
          if (chk.ok) {
            ctx.fillStyle = "#FFD67A";
            ctx.beginPath(); ctx.arc(p.sx - 15, p.sy - r * 3.1 + bobY, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#8A5311"; ctx.font = "bold 11px sans-serif";
            ctx.fillText("★", p.sx - 15, p.sy - r * 3.1 + bobY + 4);
          }
        }
        if (ch.bubble) {
          const bx = p.sx + 16, by = p.sy - r * 3.0 + bobY + Math.sin(tSec * 4) * 2;
          ctx.fillStyle = ch.bubble.hex;
          ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#FFF8EC"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#FFF"; ctx.font = "bold 11px sans-serif";
          ctx.fillText("!", bx, by + 4);
        }
        if (ch.floatText) {
          const ft = ch.floatText.text.slice(0, 22);
          const tw = ctx.measureText(ft).width + 14;
          ctx.fillStyle = "rgba(255, 248, 235, 0.95)";
          rRect(ctx, p.sx - tw / 2, p.sy - r * 4.4 + bobY, tw, 22, 10); ctx.fill();
          ctx.strokeStyle = "#D9AC7C"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = "#46455E"; ctx.font = "11px sans-serif";
          ctx.fillText(ft, p.sx, p.sy - r * 4.4 + bobY + 14);
        }
    }

    function drawPaperPet(tSec) {
      const y = getElevationAt(paperPet.x, paperPet.z);
      const p = worldToScreen(paperPet.x, y, paperPet.z);
      const sq = 1 + Math.sin(tSec * 5) * 0.06 * paperPet.squash;
      paperPet.squash = Math.max(1, paperPet.squash - 0.02);
      ctx.save();
      ctx.translate(p.sx, p.sy);
      ctx.scale(sq, 2 - sq);
      // Thick cream die-cut outline
      ctx.fillStyle = "#FFFDF8"; ctx.strokeStyle = "#46455E"; ctx.lineWidth = 2;
      rRect(ctx, -14, -20, 28, 20, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#46455E"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("=^･^=", 0, -6);
      ctx.restore();
    }

    function drawAtmosphereAndLights(tSec) {
      if (state.timeSlot === "dusk") {
        ctx.fillStyle = "rgba(255, 174, 102, 0.14)";
        ctx.fillRect(0, 0, viewW, viewH);
      } else if (state.timeSlot === "night") {
        ctx.fillStyle = "rgba(33, 47, 82, 0.42)";
        ctx.fillRect(0, 0, viewW, viewH);
      }

      // Rotating West Cape Lighthouse Beam (dusk or night when relit or freeRoam)
      const lhLit = (state.timeSlot !== "afternoon") && (state.events.includes("lighthouse_relight") || state.freeRoamMode || chapterIdx(state.chapter) >= 2);
      if (lhLit) {
        const lp = worldToScreen(-56, 5.4 + 6.5, -24);
        const angle = (tSec * (Math.PI * 2 / 12)) % (Math.PI * 2); // 12-second sweep!
        ctx.save();
        ctx.translate(lp.sx, lp.sy);
        ctx.rotate(angle);
        const grad = ctx.createLinearGradient(0, 0, 28 * camZoom, 0);
        grad.addColorStop(0, "rgba(255, 214, 122, 0.52)");
        grad.addColorStop(1, "rgba(255, 214, 122, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(28 * camZoom, -5 * camZoom);
        ctx.lineTo(28 * camZoom, 5 * camZoom);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      // Night/Dusk Warm Amber Glow Pools
      if (state.timeSlot !== "afternoon") {
        const glowSpots = [[-10, 1.8, -2], [44, 1.8, -4], [-16, 3.6, 42], [-42, 0.3, -30], [52, 0.2, -32], [0, 5.4, 58]];
        glowSpots.forEach(([x, y, z]) => {
          const gp = worldToScreen(x, y, z);
          const rg = ctx.createRadialGradient(gp.sx, gp.sy, 4, gp.sx, gp.sy, 5.5 * camZoom);
          rg.addColorStop(0, "rgba(255, 214, 122, 0.32)");
          rg.addColorStop(1, "rgba(255, 214, 122, 0)");
          ctx.fillStyle = rg;
          ctx.beginPath(); ctx.arc(gp.sx, gp.sy, 5.5 * camZoom, 0, Math.PI * 2); ctx.fill();
        });
      }

      // Fireflies at night around Zone N & Zone S
      if (state.timeSlot === "night" || state.weather === "starlight") {
        for (let i = 0; i < 24; i++) {
          const fx = -10 + Math.sin(tSec * 0.7 + i * 1.9) * 32;
          const fz = 36 + Math.cos(tSec * 0.5 + i * 2.3) * 18;
          const fp = worldToScreen(fx, 4.2, fz);
          ctx.fillStyle = `rgba(255, 232, 130, ${0.45 + Math.sin(tSec * 4 + i) * 0.45})`;
          ctx.beginPath(); ctx.arc(fp.sx, fp.sy, 3, 0, Math.PI * 2); ctx.fill();
        }
      }

      // Rain drops
      if (state.weather === "rain") {
        ctx.strokeStyle = "rgba(215, 240, 255, 0.48)";
        ctx.lineWidth = 1.3;
        for (let i = 0; i < 60; i++) {
          const rx = ((i * 97 + tSec * 120) % viewW);
          const ry = ((i * 53 + tSec * 380) % viewH);
          ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 14); ctx.stroke();
        }
      }

      // Soft Mist over locked zones
      if (!state.freeRoamMode) {
        const lockedOverlay = [
          { zone: "ZoneW", box: [-68, -42, -32, 34], label: "🔒 西翼 · 完成序幕解锁" },
          { zone: "ZoneE", box: [32, -40, 68, 32], label: "🔒 东翼 · 完成第一章解锁" },
          { zone: "ZoneN", box: [-54, 28, 54, 68], label: "🔒 北麓 · 完成第二章培育蓝玫瑰解锁" },
          { zone: "ZoneS", box: [-34, -54, 28, -33], label: "🔒 南屿 · 完成第三章合龙解锁" }
        ];
        lockedOverlay.forEach(item => {
          if (isZoneUnlocked(item.zone)) return;
          const [x1, z1, x2, z2] = item.box;
          const tl = worldToScreen(x1, 3.6, z2), br = worldToScreen(x2, 0.2, z1);
          ctx.fillStyle = "rgba(245, 248, 252, 0.46)";
          ctx.fillRect(tl.sx, tl.sy, br.sx - tl.sx, br.sy - tl.sy);
          ctx.fillStyle = "#5A587D"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
          ctx.fillText(item.label, (tl.sx + br.sx) / 2, (tl.sy + br.sy) / 2);
        });
      }
    }

    // ==================== 10B. 室内剖面模式渲染 (F04 & F31) ====================

    function drawInteriorScene(tSec) {

        ctx.strokeStyle = "#9D623E"; ctx.lineWidth = 8; ctx.stroke();
        // Wooden floor
        ctx.fillStyle = "#E4BA8B"; ctx.fillRect(ox + 10, oy + ch * 0.46, cw - 20, ch * 0.52);
        // Planks

        for (let py = oy + ch * 0.52; py < oy + ch - 12; py += 26) {

        ctx.fillStyle = "#46455E"; rRect(ctx, fx - 32, fy - 58, 64, 58, 6); ctx.fill();
        ctx.fillStyle = "#FF8C42"; ctx.beginPath(); ctx.arc(fx, fy - 18, 22 + Math.sin(tSec * 7) * 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFD67A"; ctx.beginPath(); ctx.arc(fx, fy - 14, 12, 0, Math.PI * 2); ctx.fill();
        interiorHotspots.push({ x: fx, y: fy - 50, r: 58, label: "🔥 暖心壁炉", onClick: () => { state.warmFuzzies += 5; playBubblePopSfx(); showToast("🔥 烤烤火暖洋洋，木柴噼啪作响 (+5 暖心值)"); updateStatsHUD(); } });

        // Framed 12x12 Pixel Flag Painting on Wall (center)
        const px = ox + cw * 0.5, py = oy + ch * 0.24;

        drawFlagCanvasIcon(px - 42, py - 42, 84, 0);
        interiorHotspots.push({ x: px, y: py, r: 58, label: "🖼️ 像素挂画", onClick: () => openDrawer("flag") });

        // Tea Table (center-right)
        const tx = ox + cw * 0.55, ty = oy + ch * 0.72;
        ctx.fillStyle = "#9D623E"; ctx.beginPath(); ctx.ellipse(tx, ty, 74, 34, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFF5E4"; ctx.beginPath(); ctx.arc(tx - 22, ty - 6, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(tx + 20, ty - 4, 10, 0, Math.PI * 2); ctx.fill();
        interiorHotspots.push({ x: tx, y: ty, r: 65, label: "☕ 泡玄米茶", onClick: () => { state.warmFuzzies += 5; playBubblePopSfx(); showToast("☕ 喝了一口温热的蜂蜜肉桂茶 (+5 暖心值)"); updateStatsHUD(); } });

        // Bookshelf (right)
        const bx = ox + cw * 0.84, by = oy + ch * 0.46;
        ctx.fillStyle = "#9D623E"; rRect(ctx, bx - 44, by - 130, 88, 130, 6); ctx.fill();
        ["#7CC6E8", "#B96A59", "#FFD67A", "#93C794"].forEach((col, i) => {
          ctx.fillStyle = col; ctx.fillRect(bx - 32 + i * 16, by - 110, 12, 32);
          ctx.fillRect(bx - 32 + ((i + 2) % 4) * 16, by - 64, 12, 32);
        });
        interiorHotspots.push({ x: bx, y: by - 60, r: 55, label: "📖 翻阅年谱", onClick: () => openDrawer("codex") });
      } else if (interiorState === "F31") {
        // Valley Memory Conservatory Greenhouse & Library
        ctx.fillStyle = "#E6F7F2"; rRect(ctx, ox, oy, cw, ch, 30); ctx.fill();
        // Arched timber ribs
        ctx.strokeStyle = "#E4BA8B"; ctx.lineWidth = 6;
        for (let i = 1; i <= 4; i++) {
          ctx.beginPath(); ctx.moveTo(ox + (cw / 5) * i, oy); ctx.lineTo(ox + (cw / 5) * i, oy + ch * 0.48); ctx.stroke();
        }
        // Stone floor
        ctx.fillStyle = "#D8D1C5"; ctx.fillRect(ox + 8, oy + ch * 0.48, cw - 16, ch * 0.5);
        // Rose Nursery Bed (left)
        const nx = ox + cw * 0.25, ny = oy + ch * 0.72;
        ctx.fillStyle = "#9D623E"; rRect(ctx, nx - 95, ny - 36, 190, 72, 10); ctx.fill();
        ctx.fillStyle = "#5E3B24"; rRect(ctx, nx - 85, ny - 28, 170, 56, 8); ctx.fill();
        state.mendelBed.slice(0, 4).forEach((f, i) => {
          ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(nx - 58 + i * 38, ny, 14, 0, Math.PI * 2); ctx.fill();
        });
        interiorHotspots.push({ x: nx, y: ny, r: 75, label: "🌷 温室育种床", onClick: () => openDrawer("mendel") });

        // Warm Reading Lamp & Chronicle Table (center)
        const rx = ox + cw * 0.56, ry = oy + ch * 0.66;
        ctx.fillStyle = "#E4BA8B"; rRect(ctx, rx - 60, ry - 25, 120, 55, 8); ctx.fill();
        ctx.fillStyle = "#FFD67A"; ctx.beginPath(); ctx.arc(rx, ry - 48, 22, Math.PI, 0); ctx.fill();
        ctx.fillStyle = "rgba(255,214,122,0.35)"; ctx.beginPath(); ctx.arc(rx, ry - 25, 65, 0, Math.PI * 2); ctx.fill();
        interiorHotspots.push({ x: rx, y: ry - 20, r: 60, label: "📜 修复四季年谱", onClick: () => { triggerEvent("chronicle_restored"); playFanfareSfx(); showToast("📜 已协助阿木整理好《四季年谱》全部篇章！"); } });

        // Tall Library Bookshelves (right)
        const lx = ox + cw * 0.84, ly = oy + ch * 0.48;
        ctx.fillStyle = "#9D623E"; rRect(ctx, lx - 48, ly - 140, 96, 140, 8); ctx.fill();
        ["#7CC6E8", "#FFD67A", "#93C794", "#F48FB1"].forEach((c, i) => {
          ctx.fillStyle = c; ctx.fillRect(lx - 34 + i * 17, ly - 118, 12, 34);
          ctx.fillRect(lx - 34 + i * 17, ly - 66, 12, 34);
        });
        interiorHotspots.push({ x: lx, y: ly - 70, r: 60, label: "📖 查阅 26 件记忆", onClick: () => openDrawer("codex") });

      // Draw Hotspot Labels
      interiorHotspots.forEach(hs => {

        ctx.font = "bold 12px sans-serif";
        const tw = ctx.measureText(hs.label).width + 16;
        rRect(ctx, hs.x - tw / 2, hs.y + 34, tw, 24, 10); ctx.fill();
        ctx.strokeStyle = "#D9AC7C"; ctx.lineWidth = 1.5; ctx.stroke();

    // ==================== 11. 主游戏循环、交互检测与迷你雷达 ====================
    let lastTime = performance.now();
    const keys = {};

    function updatePlayer(dt) {
      if (interiorState) return;

      if (player.sliding) {
        const s = player.sliding;
        s.t += dt;
        const k = Math.min(1, s.t / s.dur);
        player.x = s.sx + (s.ex - s.sx) * k;
        player.z = s.sz + (s.ez - s.sz) * k;
        player.y = 4.5 * (1 - k) + 1.8 * k;
        spawnParticles(player.x, player.y + 0.5, player.z, "fx_sparkle", 1);
        if (k >= 1) { player.sliding = null; player.y = getElevationAt(player.x, player.z); }
        return;
      }
      if (player.ferrying) {
        const f = player.ferrying;
        f.t += dt;
        const k = Math.min(1, f.t / f.dur);
        player.x = f.sx + (f.ex - f.sx) * k;
        player.z = f.sz + (f.ez - f.sz) * k;
        player.y = 0.35 + Math.sin(k * Math.PI) * 0.4;
        if (k >= 1) { player.ferrying = null; player.y = getElevationAt(player.x, player.z); }
        return;
      }

      let mx = 0, mz = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) mz += 1;
      if (keys["KeyS"] || keys["ArrowDown"]) mz -= 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
      if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;

      if (mx !== 0 || mz !== 0) {
        player.target = null;
        const len = Math.hypot(mx, mz);
        mx /= len; mz /= len;
      } else if (player.target) {
        const dx = player.target.x - player.x, dz = player.target.z - player.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.35) { player.target = null; }
        else { mx = dx / d; mz = dz / d; }
      }

      player.vx = mx * player.speed;
      player.vz = mz * player.speed;

      if (mx !== 0 || mz !== 0) {
        const nx = player.x + player.vx * dt;
        const nz = player.z + player.vz * dt;
        const zone = getZoneAt(nx, nz);
        if (!isZoneUnlocked(zone)) {
          player.target = null;
          if (Math.random() < 0.08) showToast(`🔒 ${zone} 尚未解锁，完成当前章节软门控（或点左上角开启「漫游模式」）即可进入`);
        } else if (isWalkable(nx, nz)) {
          player.x = nx; player.z = nz;
          player.y = getElevationAt(nx, nz);
          player.walkPhase += dt * 10;
          if (player.y < 0 && Math.random() < 0.16) spawnParticles(player.x, 0, player.z, "fx_ripple", 1);
        } else {
          player.target = null;
        }
      }

      // Paper pet follows player gently!
      const pdx = (player.x + 1.8) - paperPet.x, pdz = (player.z - 0.6) - paperPet.z;
      if (Math.hypot(pdx, pdz) > 1.2) {
        paperPet.x += pdx * Math.min(1, dt * 2.4);
        paperPet.z += pdz * Math.min(1, dt * 2.4);
      }

      // Smooth camera follow
      camX += (player.x + camPanOffset.x - camX) * Math.min(1, dt * 6);
      camZ += (player.z + camPanOffset.z - camZ) * Math.min(1, dt * 6);

      // Auto-mark visited facilities within 5m
      DB.facilities.forEach(fac => {
        if (isFacilityUnlocked(fac) && Math.hypot(player.x - fac.pos[0], player.z - fac.pos[2]) < 5.0) {
          markFacilityVisited(fac.id);
        }
      });
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(pt => {
        const p = worldToScreen(pt.x, pt.y, pt.z);
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        if (pt.type === "fx_heart") {
          ctx.fillStyle = "#F472B6"; ctx.font = "14px sans-serif"; ctx.fillText("♥", p.sx, p.sy);
        } else if (pt.type === "fx_petal") {
          ctx.fillStyle = "#F9A8D4"; ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 4, 2.5, pt.life * 3, 0, Math.PI * 2); ctx.fill();
        } else if (pt.type === "fx_ripple") {
          ctx.strokeStyle = "#7CC6E8"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(p.sx, p.sy, (2.2 - pt.life) * 12, (2.2 - pt.life) * 6, 0, 0, Math.PI * 2); ctx.stroke();
        } else {
          ctx.fillStyle = "#FFD67A"; ctx.beginPath(); ctx.arc(p.sx, p.sy, 3.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      });
    }

    function updateProximityButtons() {
      if (interiorState || activeDlg) {
        document.getElementById("interactPillWrap").innerHTML = "";
        return;
      }
      const nearNpc = npcs.filter(n => isResidentUnlocked(n.def))
        .map(n => ({ n, d: Math.hypot(n.x - player.x, n.z - player.z) }))
        .filter(o => o.d < 5.5).sort((a, b) => a.d - b.d)[0];

      const nearFac = DB.facilities.filter(f => isFacilityUnlocked(f))
        .map(f => ({ f, d: Math.hypot(f.pos[0] - player.x, f.pos[2] - player.z) }))
        .filter(o => o.d < 6.5).sort((a, b) => a.d - b.d)[0];

      const f42 = DB.facilities.find(f => f.id === "F42");
      const nearBike = isFacilityUnlocked(f42) && f42.subAnchors.some(s => Math.hypot(s.pos[0] - player.x, s.pos[2] - player.z) < 5.0);
      const f35 = DB.facilities.find(f => f.id === "F35");
      const nearSlide = isFacilityUnlocked(f35) && f35.subAnchors.find(s => Math.hypot(s.pos[0] - player.x, s.pos[2] - player.z) < 5.5);
      const nearSign = MICRO_PROPS.find(m => m.kind === "sign" && !state.stats.straightSignIds.includes(m.id) && Math.hypot(m.x - player.x, m.z - player.z) < 4.5);

      const sig = `${nearNpc ? nearNpc.n.id : ""}|${nearFac ? nearFac.f.id : ""}|${nearBike}|${nearSlide ? nearSlide.id : ""}|${nearSign ? nearSign.id : ""}`;
      const wrap = document.getElementById("interactPillWrap");
      if (wrap.dataset.sig === sig) return;
      wrap.dataset.sig = sig;
      wrap.innerHTML = "";

      if (nearNpc) {
        const b = document.createElement("button");
        b.className = "btn primary";
        b.textContent = `💬 对话 ${nearNpc.n.name} [E]`;
        b.addEventListener("click", () => talkToNpc(nearNpc.n));
        wrap.appendChild(b);
      }
      if (nearFac) {
        const b = document.createElement("button");
        b.className = "btn amber";
        const verb = nearFac.f.id === "F04" || nearFac.f.id === "F31" ? "进入室内" :
          (nearFac.f.id === "F01" || nearFac.f.id === "F40" || nearFac.f.id === "F26") ? "乘摇橹渡船" : "交互";
        b.textContent = `✨ ${verb}·${nearFac.f.name.slice(0, 8)} [E]`;
        b.addEventListener("click", () => interactWithFacility(nearFac.f));
        wrap.appendChild(b);
      }
      if (nearBike) {
        const b = document.createElement("button");
        b.className = "btn mint";
        b.textContent = "🚲 邮差单车4区快传";
        b.addEventListener("click", openBikeFastTravel);
        wrap.appendChild(b);
      }
      if (nearSlide) {
        const b = document.createElement("button");
        b.className = "btn mint";
        b.textContent = `🛝 滑下${nearSlide.name}`;
        b.addEventListener("click", () => triggerTimberSlide(nearSlide));
        wrap.appendChild(b);
      }
      if (nearSign) {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = `📐 扶正${nearSign.label} (取悦咔哒)`;
        b.addEventListener("click", () => {
          state.stats.straightSignIds.push(nearSign.id);
          state.warmFuzzies += 8;
          playBubblePopSfx();
          showToast("📐 咔哒看到歪指路牌被扶正了，幸福得原地敬礼 (+8 暖心)");
          wrap.dataset.sig = "";
          updateStatsHUD();
        });
        wrap.appendChild(b);
      }
    }

    function drawMiniMap() {
      const mc = document.getElementById("miniMapCanvas");
      const mctx = mc.getContext("2d");
      const mw = mc.width, mh = mc.height;
      mctx.fillStyle = "#7CC6E8"; mctx.fillRect(0, 0, mw, mh);
      const tx = (x) => ((x + 68) / 136) * mw;
      const tz = (z) => ((68 - z) / 122) * mh;
      // Zone shapes
      mctx.fillStyle = "#F5E6C8"; mctx.fillRect(tx(-64), tz(34), tx(64) - tx(-64), tz(-34) - tz(34));
      mctx.fillStyle = "#B7DDA8"; mctx.fillRect(tx(-61), tz(64), tx(61) - tx(-61), tz(-14) - tz(64));
      mctx.fillStyle = "#93C794"; mctx.fillRect(tx(-50), tz(62), tx(50) - tx(-50), tz(14) - tz(62));
      mctx.fillStyle = "#F5E6C8"; mctx.fillRect(tx(-22), tz(-35), tx(20) - tx(-22), tz(-51) - tz(-35));

      // Residents
      npcs.forEach(n => {
        if (!isResidentUnlocked(n.def)) return;
        mctx.fillStyle = "#FFD67A";
        mctx.beginPath(); mctx.arc(tx(n.x), tz(n.z), 3, 0, Math.PI * 2); mctx.fill();
      });
      // Player
      mctx.fillStyle = "#B96A59";
      mctx.beginPath(); mctx.arc(tx(player.x), tz(player.z), 4.5, 0, Math.PI * 2); mctx.fill();
      mctx.strokeStyle = "#FFF"; mctx.lineWidth = 1.5; mctx.stroke();
    }

    function renderFrame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const tSec = now / 1000;

      updatePlayer(dt);
      updateResidentsAI(dt);
      updateParticles(dt);

      if (interiorState) {
        drawInteriorScene(tSec);
      } else {
        drawTerrainLayer(tSec);

        // Draw sub-anchors of F42
        const f42 = DB.facilities.find(f => f.id === "F42");
        if (f42 && isFacilityUnlocked(f42)) {
          f42.subAnchors.slice(1).forEach(st => drawBikeStopAt(st.pos[0], st.pos[1], st.pos[2]));
        }

        // Depth-sorted render list (North-to-South: larger Z first)
        const drawQueue = [];
        DB.facilities.forEach(f => {
          drawQueue.push({ z: f.pos[2], fn: () => drawFacilityVisual(f, tSec) });
          if (f.subAnchors && f.id !== "F42" && f.id !== "F35") {
            f.subAnchors.forEach(sub => {
              if (Math.hypot(sub.pos[0] - f.pos[0], sub.pos[2] - f.pos[2]) < 1.0) return;
              const vFac = { id: sub.id, name: sub.name, pos: sub.pos, size: f.size, unlockChapter: f.unlockChapter };
              drawQueue.push({ z: sub.pos[2], fn: () => drawFacilityVisual(vFac, tSec) });
            });
          }
        });
        MICRO_PROPS.forEach(m => {
          drawQueue.push({ z: m.z, fn: () => drawMicroProp(m, tSec) });
        });
        npcs.forEach(n => {
          if (isResidentUnlocked(n.def)) drawQueue.push({ z: n.z, fn: () => drawChibiCharacter(n, false, tSec) });
        });
        drawQueue.push({ z: paperPet.z, fn: () => drawPaperPet(tSec) });
        drawQueue.push({ z: player.z, fn: () => drawChibiCharacter(player, true, tSec) });

        drawQueue.sort((a, b) => b.z - a.z);
        drawQueue.forEach(item => item.fn());

        // Click waypoint marker
        if (player.target) {
          const wp = worldToScreen(player.target.x, getElevationAt(player.target.x, player.target.z), player.target.z);
          ctx.strokeStyle = "#FFD67A"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.ellipse(wp.sx, wp.sy, 8 + Math.sin(tSec * 6) * 2, 4 + Math.sin(tSec * 6), 0, 0, Math.PI * 2); ctx.stroke();
        }

        drawParticles();
        drawAtmosphereAndLights(tSec);
        updateProximityButtons();
      }

      drawMiniMap();
      if (activeDlg && dialogueMotion) {
        const { npc } = dialogueMotion;
        const pose = sampleResidentPose(npc);
        const r = 28;
        const hover = npc.id === "C05" ? 4 + Math.sin(tSec * 3.5) * 3 : 0;
        motionCtx.clearRect(0, 0, motionCanvas.width, motionCanvas.height);
        drawChibiPose(motionCtx, npc, false, r, pose, 54, 96 - pose.lift * r - hover);
      }
      requestAnimationFrame(renderFrame);
    }

    // ==================== 12. 指针抓起轻推 (つまむ) & 键盘/鼠标操控 ====================
    let draggedNpc = null;
    let panning = false, panStart = null, pointerMoved = false;

    canvas.addEventListener("pointerdown", e => {
      ensureAudio();
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

      if (interiorState) {
        const hit = interiorHotspots.find(h => Math.hypot(sx - h.x, sy - h.y) <= h.r);
        if (hit) hit.onClick();
        return;
      }

      // 1. Click Worry Bubble?
      for (const npc of npcs) {
        if (!isResidentUnlocked(npc.def) || !npc.bubble) continue;
        const p = worldToScreen(npc.x, npc.y, npc.z);
        const bx = p.sx + 16, by = p.sy - 0.56 * camZoom * 3.0;
        if (Math.hypot(sx - bx, sy - by) < 16) {
          state.warmFuzzies += 10;
          addAffection(npc.id, 6);
          playBubblePopSfx();
          spawnParticles(npc.x, npc.y + 1, npc.z, "fx_heart", 10);
          showToast(`💭 安抚了 ${npc.name} 的「${npc.bubble.label}」：${npc.bubble.event.title} (+10 暖心)`);
          npc.bubble = null;
          updateStatsHUD();
          return;
        }
      }

      // 2. Pick up Resident (つまむ)?
      for (const npc of npcs) {
        if (!isResidentUnlocked(npc.def)) continue;
        const p = worldToScreen(npc.x, npc.y, npc.z);
        if (Math.hypot(sx - p.sx, sy - (p.sy - 0.6 * camZoom)) < Math.max(20, 0.9 * camZoom)) {
          draggedNpc = npc;
          npc.state = "dragged";
          pointerMoved = false;
          canvas.classList.add("dragging");
          playPickupSfx();
          return;
        }
      }

      if (e.button === 2 || e.button === 1) {
        panning = true; panStart = { sx, sy, ox: camPanOffset.x, oz: camPanOffset.z };
      } else {
        panStart = { sx, sy, ox: camPanOffset.x, oz: camPanOffset.z };
        pointerMoved = false;
      }
    });

    canvas.addEventListener("pointermove", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (draggedNpc) {
        pointerMoved = true;
        const w = screenToWorldGround(sx, sy);
        if (isWalkable(w.wx, w.wz)) {
          draggedNpc.x = w.wx; draggedNpc.z = w.wz;
          draggedNpc.y = getElevationAt(w.wx, w.wz);
        }
        return;
      }
      if (panning && panStart) {
        camPanOffset.x = Math.max(-25, Math.min(25, panStart.ox - (sx - panStart.sx) / camZoom));
        camPanOffset.z = Math.max(-25, Math.min(25, panStart.oz + (sy - panStart.sy) / (camZoom * 0.86)));
      }
    });

    canvas.addEventListener("pointerup", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (draggedNpc) {
        const npc = draggedNpc;
        draggedNpc = null;
        canvas.classList.remove("dragging");
        if (!pointerMoved) {
          npc.state = "idle";
          talkToNpc(npc);
          return;
        }
        npc.state = "idle"; npc.tx = npc.x; npc.tz = npc.z;
        state.nudgeCounts[npc.id] = (state.nudgeCounts[npc.id] || 0) + 1;
        state.yesterdayAction = "nudged_resident";
        playDropSfx();
        const other = npcs.find(o => o !== npc && isResidentUnlocked(o.def) && Math.hypot(o.x - npc.x, o.z - npc.z) < 4.5);
        const nearFac = DB.facilities.find(f => Math.hypot(f.pos[0] - npc.x, f.pos[2] - npc.z) < 5.5);

        if (npc.id === "C03") {
          triggerNpcAction(npc, "clap", "fx_sparkle");
          npc.floatText = { text: "……啪、啪。我面瘫但我记在心里了。", t: 3.5 };
        } else if (other) {
          triggerNpcAction(npc, "hop_bounce", "fx_heart");
          npc.floatText = { text: `呀，跟 ${other.name} 打了个照面！`, t: 3.5 };
        } else if (nearFac) {
          triggerNpcAction(npc, "nod_tilt", "fx_sparkle");
          npc.floatText = { text: `嗯，${nearFac.name} 旁边风挺软。`, t: 3.5 };
        } else {
          triggerNpcAction(npc, "hop_bounce", "none");
          npc.floatText = { text: npc.def.quirk.behaviorHint.slice(0, 18) + "…", t: 3.5 };
        }
        showToast(`🖐️ 轻推了 ${npc.name} (累计 ${state.nudgeCounts[npc.id]} 次，可在对应景点对话触发第 2 幕小剧本！)`);
        return;
      }
      if (panning) { panning = false; return; }

      if (!interiorState && e.button === 0) {
        const w = screenToWorldGround(sx, sy);
        // Check if user clicked a facility directly within 3.5m -> walk there!
        camPanOffset = { x: 0, z: 0 };
        if (isZoneUnlocked(getZoneAt(w.wx, w.wz)) && isWalkable(w.wx, w.wz)) {
          player.target = { x: w.wx, z: w.wz };
        } else {
          showToast("🌊 那片区域在海面或待解锁边界外");
        }
      }
    });

    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      camZoom = Math.max(9.5, Math.min(28, camZoom - Math.sign(e.deltaY) * 1.4));
    }, { passive: false });

    document.getElementById("miniMapCanvas").addEventListener("click", e => {
      const r = e.target.getBoundingClientRect();
      const wx = ((e.clientX - r.left) / r.width) * 136 - 68;
      const wz = 68 - ((e.clientY - r.top) / r.height) * 122;
      if (isZoneUnlocked(getZoneAt(wx, wz)) && isWalkable(wx, wz)) {
        player.target = { x: wx, z: wz };
        camPanOffset = { x: 0, z: 0 };
      } else {
        showToast("🔒 请先解锁该片区或开启右上「漫游模式」");
      }
    });

    window.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      keys[e.code] = true;
      if (e.code === "KeyE") {
        if (interiorState) { exitInterior(); return; }
        const firstBtn = document.querySelector("#interactPillWrap .btn");
        if (firstBtn) firstBtn.click();
      } else if (e.code === "Escape" && interiorState) {
        exitInterior();
      } else if (e.code === "Space" && activeDlg) {
