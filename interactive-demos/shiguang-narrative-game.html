      const resBox = document.createElement("div");
      resBox.className = "panel-box";
      resBox.innerHTML = `<strong>🐾 9 位怪友阶段进度（共 ${Object.values(state.charStages).reduce((a, b) => a + b, 0)}/27 幕 · 好感绝不衰减）</strong>`;

      npcs.forEach(npc => {
        const st = state.charStages[npc.id] || 0;
        const aff = state.affection[npc.id] || 25;
        const unlocked = isResidentUnlocked(npc.def);
        const tier = npc.def.bondTiers.find(t => aff >= t.range[0] && aff <= t.range[1]) || npc.def.bondTiers[0];
        const nextScript = (npc.ms && st < 3) ? npc.ms.scripts[st] : null;
        const asset = ASSET_BY_CODE[npc.id];

        const card = document.createElement("div");
        card.className = "res-card";
        card.innerHTML = `
          <div style="display:flex;gap:10px;align-items:center;">
            <img src="../workspace/assets/3d-modeling-closeups/${asset.id}.png" onerror="this.style.display='none'" style="width:46px;height:46px;border-radius:10px;object-fit:contain;background:#F5E6C8;border:1px solid #D9AC7C;" />
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong>${npc.def.species}·${npc.name}</strong>
                <span class="badge">${st}/3 幕 · ${tier.label}</span>
              </div>
              <div style="font-size:11px;color:var(--warm-slate);margin:2px 0;">好感度 ${aff}/255 · 轻推 ${state.nudgeCounts[npc.id] || 0} 次 · ${unlocked ? "已在岛上" : `第${chapterIdx(npc.def.unlockChapter)}章登场`}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${(aff / 255) * 100}%"></div></div>
            </div>
          </div>
          <div style="font-size:11px;color:var(--warm-slate);">${nextScript ? `下一幕「${nextScript.title}」：${nextScript.trigger.summaryZh}` : "✨ 已完成全部 3 幕个人小剧本！"}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn locate-btn">📍 走到 TA 身边</button>
            ${nextScript ? `<button class="btn amber play-stage-btn">🎭 排练第 ${st + 1} 幕</button>` : ""}
          </div>
        `;
        card.querySelector(".locate-btn").addEventListener("click", () => {
          if (!unlocked) { showToast("🔒 请先开启漫游模式或推进章节以解锁此居民"); return; }
          player.x = npc.x; player.z = npc.z - 2.2; player.y = getElevationAt(player.x, player.z);
          player.target = null; closeDrawer();
          showToast(`📍 已步行至 ${npc.name} 身边`);
        });
        const psBtn = card.querySelector(".play-stage-btn");
        if (psBtn) {
          psBtn.addEventListener("click", () => {
            if (!unlocked) state.freeRoamMode = true;
            closeDrawer();
            prepAndPlayScript(npc, nextScript);
          });
        }
        resBox.appendChild(card);
      });
      body.appendChild(resBox);

      // Duo Encounters
      const duoBox = document.createElement("div");
      duoBox.className = "panel-box";
      duoBox.innerHTML = `<strong>👯 3 段双人偶遇微剧场 (D01–D03)</strong>`;
      MS.duoEncounters.forEach(d => {
        const done = Boolean((state.duoMask >> d.duoBitIndex) & 1);
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #E4BA8B;font-size:12px;";
        row.innerHTML = `<div><b>${d.scriptId}《${d.title}》</b><div style="font-size:11px;color:var(--warm-slate);">${d.trigger.summaryZh}</div></div>`;
        const b = document.createElement("button");
        b.className = done ? "btn" : "btn mint";
        b.textContent = done ? "✓ 重温" : "🎭 立即演绎";
        b.addEventListener("click", () => {
          closeDrawer();
          const f = DB.facilities.find(x => x.id === d.trigger.facilityId);
          if (f) {
            player.x = f.pos[0]; player.z = f.pos[2] - 2.5;
            d.participants.forEach((pid, idx) => {
              const p = npcs.find(n => n.id === pid);
              if (p) { p.x = f.pos[0] + (idx === 0 ? -1.4 : 1.4); p.z = f.pos[2] - 0.8; p.y = f.pos[1]; }
            });
          }
          startDuoDialogue(d);
        });
        row.appendChild(b);
        duoBox.appendChild(row);
      });
      body.appendChild(duoBox);

      // 26 Collectibles
      const memBox = document.createElement("div");
      memBox.className = "panel-box";
      memBox.innerHTML = `<strong>📖 26 件海湾记忆碎片 (${state.collectedMemories.length}/26)</strong>`;
      DB.collectibles.forEach(m => {
        const has = state.collectedMemories.includes(m.id);
        const item = document.createElement("div");
        item.style.cssText = `padding:8px;border-radius:10px;border:1px solid #E4BA8B;background:${has ? "#FFF9EE" : "#F3EFE6"};font-size:12px;`;
        item.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <b>${m.id} · ${m.title}</b>
            <span class="badge ${has ? "" : "amber"}">${m.categoryLabel} · ${has ? "已收集" : m.facilityId}</span>
          </div>
          <div style="font-size:11.5px;color:var(--warm-slate);margin-top:4px;">${has ? m.excerpt : `前往 ${m.facilityId} 交互即可拾取此记忆碎片`}</div>
        `;
        if (!has) {
          const btn = document.createElement("button");
          btn.className = "btn"; btn.style.marginTop = "5px"; btn.textContent = `🧭 前往 ${m.facilityId}`;
          btn.addEventListener("click", () => {
            const fac = DB.facilities.find(f => f.id === m.facilityId);
            if (fac) {
              if (!isFacilityUnlocked(fac)) { showToast("🔒 该设施所在片区尚未解锁，可先在左上角开启「漫游模式」"); return; }
              player.x = fac.pos[0]; player.z = fac.pos[2] - 2.2; player.y = getElevationAt(player.x, player.z);
              closeDrawer();
            }
          });
          item.appendChild(btn);
        }
        memBox.appendChild(item);
      });
      body.appendChild(memBox);
    }

    function prepAndPlayScript(npc, script) {
      const fac = DB.facilities.find(f => f.id === script.trigger.facilityId);
      if (fac) {
        if (!isFacilityUnlocked(fac)) state.freeRoamMode = true;
        player.x = fac.pos[0]; player.z = fac.pos[2] - 2.5; player.y = fac.pos[1];
        npc.x = fac.pos[0] + 1.2; npc.z = fac.pos[2] - 0.8; npc.tx = npc.x; npc.tz = npc.z; npc.y = fac.pos[1];
        markFacilityVisited(fac.id);
      }
      if (script.trigger.timeOfDay === "sunset") state.timeSlot = "dusk";
      else if (script.trigger.timeOfDay === "night") state.timeSlot = "night";
      else if (script.trigger.timeOfDay === "day") state.timeSlot = "afternoon";
      syncEnvControls();
      startMiniScriptDialogue(npc, script);
    }

    function renderSavePanel(body) {
      const compact = buildCompactSavePayload();
      const jsonStr = JSON.stringify(compact);
      const bytes = new Blob([jsonStr]).size;
      const box = document.createElement("div");
      box.className = "panel-box";
      box.innerHTML = `
        <strong>💾 DataStore 本地存档与字节预算监测</strong>
        <div style="display:flex;justify-content:space-between;font-size:12px;">
          <span>当前紧凑载荷字节数（限额 6000 B）</span>
          <strong style="color:#3D6B3B;">${bytes} B / 6000 B (${((bytes / 6000) * 100).toFixed(1)}%)</strong>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (bytes / 6000) * 100)}%"></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="saveBtn" class="btn primary">💾 立即存档</button>
          <button id="loadBtn" class="btn mint">📂 读取存档</button>
          <button id="resetBtn" class="btn">🔄 重置新开局</button>
        </div>
        <div style="font-size:11px;font-family:monospace;background:#F5E6C8;padding:8px;border-radius:8px;word-break:break-all;max-height:140px;overflow-y:auto;">${jsonStr}</div>
      `;
      body.appendChild(box);
      box.querySelector("#saveBtn").addEventListener("click", () => { saveGame(false); renderSavePanel(body); });
      box.querySelector("#loadBtn").addEventListener("click", () => { loadGame(false); closeDrawer(); });
      box.querySelector("#resetBtn").addEventListener("click", () => {
        localStorage.removeItem(DB.saveSchema.datastoreKey);
        state = createInitialState();
        player.x = -6; player.z = -18; player.y = 0.2;
        syncEnvControls(); updateStatsHUD(); closeDrawer();
        showToast("🌱 已重置为全新《时光小筑》序幕开局");
      });
    }

    // ==================== 14. 62 项 3D 建模资产特写图鉴弹窗 ====================
    let selectedGalAsset = ASSETS_62[0];

    function renderGallery() {
      const batch = document.getElementById("galBatchFilter").value;
      const cat = document.getElementById("galCatFilter").value;
      const q = document.getElementById("galSearchInput").value.trim().toLowerCase();
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";

      const list = ASSETS_62.filter(a => {
        if (batch !== "all" && a.batch !== batch) return false;
        if (cat !== "all" && a.category !== cat) return false;
        if (q && !(a.id.toLowerCase().includes(q) || a.name_zh.toLowerCase().includes(q) || a.code.toLowerCase().includes(q))) return false;
        return true;
      });

      list.forEach(a => {
        const card = document.createElement("button");
        card.className = "asset-card";
        if (selectedGalAsset && selectedGalAsset.id === a.id) card.style.borderColor = "var(--terracotta)";
        card.innerHTML = `
          <div class="asset-thumb-wrap">
            <img class="asset-thumb" src="../workspace/assets/3d-modeling-closeups/${a.id}.png" alt="${a.name_zh}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
            <div class="asset-fallback" style="display:none;">🖼️ ${a.code}<br/>未找到本地PNG</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="badge">Batch ${a.batch}</span>
            <span style="font-family:monospace;font-size:11px;font-weight:700;">${a.code}</span>
          </div>
          <div style="font-size:12px;font-weight:700;line-height:1.25;">${a.name_zh}</div>
        `;
        card.addEventListener("click", () => { selectedGalAsset = a; renderGalleryDetail(); renderGallery(); });
        grid.appendChild(card);
      });
      renderGalleryDetail();
    }

    function renderGalleryDetail() {
      const d = document.getElementById("galleryDetail");
      const a = selectedGalAsset || ASSETS_62[0];
      d.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:16px;">${a.code} · ${a.name_zh}</strong>
          <span class="badge amber">Batch ${a.batch} · ${a.category}</span>
        </div>
        <div style="font-size:12px;color:var(--warm-slate);">${a.name_en}</div>
        <div style="background:#F5E6C8;border:2px solid #D9AC7C;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:240px;">
          <img src="../workspace/assets/3d-modeling-closeups/${a.id}.png" alt="${a.name_zh}" style="max-width:100%;max-height:280px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" />
          <div class="asset-fallback" style="display:none;">无法加载 ../workspace/assets/3d-modeling-closeups/${a.id}.png</div>
        </div>
        <div class="panel-box" style="font-size:12px;">
          <div><b>所属片区：</b>${a.zone}</div>
          <div><b>尺度规格：</b><code>${a.dimensions}</code></div>
          <div><b>资产文件：</b><code>../workspace/assets/3d-modeling-closeups/${a.id}.png</code></div>
          <div><b>造型核心：</b>${a.subject}</div>
        </div>
      `;
    }

    // ==================== 15. HUD 控制、通知与事件绑定 ====================
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toastBanner");
      el.textContent = msg;
      el.classList.remove("hidden");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("hidden"), 4200);
    }

    function syncEnvControls() {
      document.querySelectorAll(".tod-btn").forEach(b => b.classList.toggle("active", b.dataset.tod === state.timeSlot));
      document.getElementById("weatherSelect").value = state.weather;
      const roamBtn = document.getElementById("toggleFreeRoamBtn");
      roamBtn.textContent = state.freeRoamMode ? "🧭 漫游: 全区开放" : "🧭 漫游: 正常";
      roamBtn.classList.toggle("active", state.freeRoamMode);
    }

    function updateStatsHUD() {
      const ch = DB.chapters[chapterIdx(state.chapter)] || DB.chapters[0];
      document.getElementById("chapterBadge").textContent = ch.title.split("：")[0];
      document.getElementById("chapterSubtitle").textContent = ch.softGateToNext ? ch.softGateToNext.description : "全岛永久无门槛开放 · 尽享治愈沙盒";
      document.getElementById("statWarm").textContent = state.warmFuzzies;
      document.getElementById("statMem").textContent = state.collectedMemories.length;
      document.getElementById("statScripts").textContent = Object.values(state.charStages).reduce((a, b) => a + b, 0);
      document.getElementById("statZone").textContent = getZoneAt(player.x, player.z);
      document.getElementById("dockBytes").textContent = getCompactByteCount();
      renderQuestChecklist();
    }

    function renderQuestChecklist() {
      const el = document.getElementById("questChecklist");
      el.innerHTML = "";
      DB.chapters.forEach(c => {
        const cur = chapterIdx(state.chapter);
        const done = c.index < cur;
        const active = c.index === cur;
        const div = document.createElement("div");
        div.style.cssText = `padding:6px 8px;border-radius:8px;margin-bottom:5px;border:1px solid #E4BA8B;background:${active ? "#FFF3D6" : "#FFFDF8"};`;
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <b>${done ? "✅" : active ? "📍" : "⏳"} ${c.title}</b>
          </div>
          <div style="font-size:11px;color:var(--warm-slate);margin-top:2px;">${c.softGateToNext ? c.softGateToNext.description : "自由探索与音乐会无限重温"}</div>
        `;
        el.appendChild(div);
      });
    }

    // Wire UI Events
    document.getElementById("toggleQuestBtn").addEventListener("click", () => {
      document.getElementById("questDropdown").classList.toggle("hidden");
    });
    document.getElementById("closeQuestBtn").addEventListener("click", () => {
      document.getElementById("questDropdown").classList.add("hidden");
    });

    const jumpSel = document.getElementById("chapterJumpSelect");
    DB.chapters.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.title;
      jumpSel.appendChild(o);
    });
    document.getElementById("chapterJumpBtn").addEventListener("click", () => {
      state.chapter = jumpSel.value;
      if (chapterIdx(state.chapter) >= 2) triggerEvent("lighthouse_relight");
      if (chapterIdx(state.chapter) >= 3) { triggerEvent("lightship_relight"); triggerEvent("blue_rose_bred"); state.mendelBlueRose = true; }
      if (chapterIdx(state.chapter) >= 4) { triggerEvent("chronicle_restored"); triggerEvent("vinyl_played"); }
      updateStatsHUD();
      showToast(`⏩ 已切换主线阶段至「${DB.chapters[chapterIdx(state.chapter)].title}」`);
    });
    document.getElementById("triggerConcertBtn").addEventListener("click", () => {
      state.freeRoamMode = true;
      syncEnvControls();
      document.getElementById("questDropdown").classList.add("hidden");
      startEchoConcertFinale();
    });

    document.getElementById("toggleFreeRoamBtn").addEventListener("click", () => {
      state.freeRoamMode = !state.freeRoamMode;
      syncEnvControls();
      showToast(state.freeRoamMode ? "🧭 全区自由漫游开启：Zone 0/W/E/N/S 与 9 位居民全部畅行！" : "🧭 已切回按章节渐进解锁模式");
    });

    document.querySelectorAll(".tod-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.timeSlot = btn.dataset.tod;
        syncEnvControls();
        const preset = DB.environmentPresets[state.timeSlot];
        showToast(`🕰️ 已切换至 ${preset.label}`);
      });
    });
    document.getElementById("weatherSelect").addEventListener("change", e => {
      state.weather = e.target.value;
    });
    document.getElementById("photoSnapBtn").addEventListener("click", () => {
      state.stats.photoCount++;
      playBubblePopSfx();
      spawnParticles(player.x, player.y + 1.5, player.z, "fx_sparkle", 12);
      showToast(`📷 咔嚓！拍下一张抱月海湾明信片快照（累计 ${state.stats.photoCount} 次）`);
    });
    document.getElementById("bgmToggleBtn").addEventListener("click", () => toggleBGM());
    document.getElementById("muteBtn").addEventListener("click", () => {
      isMuted = !isMuted;
      document.getElementById("muteBtn").textContent = isMuted ? "🔇" : "🔊";
    });
    document.getElementById("exitInteriorBtn").addEventListener("click", exitInterior);

    document.querySelectorAll("[data-drawer]").forEach(btn => {
      btn.addEventListener("click", () => openDrawer(btn.dataset.drawer));
    });
    document.querySelectorAll(".dtab").forEach(btn => {
      btn.addEventListener("click", () => openDrawer(btn.dataset.tab));
    });
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerOverlay").addEventListener("click", e => {
      if (e.target.id === "drawerOverlay") closeDrawer();
    });

    document.getElementById("openGalleryBtn").addEventListener("click", () => {
      document.getElementById("galleryModal").classList.remove("hidden");
      renderGallery();
    });
    document.getElementById("closeGalleryBtn").addEventListener("click", () => {
      document.getElementById("galleryModal").classList.add("hidden");
    });
    ["galBatchFilter", "galCatFilter"].forEach(id => document.getElementById(id).addEventListener("change", renderGallery));
    document.getElementById("galSearchInput").addEventListener("input", renderGallery);

    document.getElementById("dlgNextBtn").addEventListener("click", advanceDialogue);
    document.getElementById("dlgCloseBtn").addEventListener("click", () => closeDialogue(false));
    document.getElementById("dlgReplayVoiceBtn").addEventListener("click", () => {
      if (!activeDlg) return;
      const line = activeDlg.lines[activeDlg.lineIdx];
      const sp = npcs.find(n => n.id === line.speaker) || activeDlg.npc;
      speakVoice(line.text, line.sfx, sp.ms ? sp.ms.voiceProfile : null);
    });
    document.getElementById("dlgGoHintBtn").addEventListener("click", () => {
      if (!activeDlg || !activeDlg.hintScript) return;
      const npc = activeDlg.npc, hs = activeDlg.hintScript;
      closeDialogue(false);
      prepAndPlayScript(npc, hs);
    });
    document.getElementById("feedFoodBtn").addEventListener("click", () => {
      if (!activeDlg || !activeDlg.npc) return;
      feedResident(activeDlg.npc, document.getElementById("feedFoodSelect").value);
    });

    // Startup
    loadGame(true);
    syncEnvControls();
    updateStatsHUD();
    showToast("🌊 欢迎来到 4× 抱月海湾《时光小筑》！按 WASD 或点击地面自由散步～");
    requestAnimationFrame(renderFrame);
  })();
  </script>
</body>
</html>
