<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《时光小筑》4× 抱月海湾 · 离线完整叙事游戏</title>
  <style>
    :root {
      --cream-green: #B7DDA8;
      --sage-leaf: #93C794;
      --warm-sand: #F5E6C8;
      --mint-sea: #7CC6E8;
      --honey-wood: #E4BA8B;
      --toasted-wood: #9D623E;
      --terracotta: #B96A59;
      --cream-wall: #FFF5E4;
      --cream-card: rgba(255, 248, 235, 0.94);
      --slate-ink: #46455E;
      --warm-slate: #5A587D;
      --amber-glow: #FFD67A;
      --border-wood: #D9AC7C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #7CC6E8;
      color: var(--slate-ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    #gameCanvas.dragging { cursor: grabbing; }

    .hud-pill {
      background: var(--cream-card);
      border: 2px solid var(--border-wood);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(90, 88, 125, 0.16);
      backdrop-filter: blur(6px);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 6px 11px; border-radius: 12px;
      border: 1.5px solid var(--border-wood);
      background: #FFF9EE; color: var(--slate-ink);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { background: #FFF0D4; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.active, .btn.primary {
      background: var(--terracotta); color: #FFF8EE; border-color: #9D4E3F;
    }
    .btn.primary:hover { background: #A85B4A; }
    .btn.mint { background: #D7F2EE; border-color: #6DB3AA; color: #2D5A55; }
    .btn.amber { background: #FFE8AF; border-color: #D8A348; color: #6B440E; }

    /* Top HUD */
    #topLeftHud {
      position: fixed; top: 12px; left: 12px; z-index: 20;
      display: flex; flex-direction: column; gap: 8px; max-width: 440px;
    }
    #chapterCard {
      padding: 9px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .chapter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: #E9F5E3; color: #3D6B3B; border: 1px solid #93C794;
    }
    .badge.amber { background: #FFF1C9; color: #8A5311; border-color: #E4BA8B; }
    #questDropdown {
      padding: 10px 14px; font-size: 12px; line-height: 1.5;
      max-height: 55vh; overflow-y: auto;
    }
    .hidden { display: none !important; }

    #topRightHud {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    #envBar {
      padding: 7px 11px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .stat-chip {
      font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
      background: #FFFDF8; border: 1px solid var(--border-wood);
      display: inline-flex; align-items: center; gap: 4px;
    }

    /* Bottom Left MiniMap */
    #miniMapWrap {
      position: fixed; bottom: 12px; left: 12px; z-index: 20;
      padding: 8px; display: flex; flex-direction: column; gap: 6px; width: 196px;
    }
    #miniMapCanvas {
      width: 176px; height: 152px; border-radius: 10px;
      border: 1.5px solid var(--border-wood); background: #7CC6E8; cursor: pointer;
    }
    .mini-hint { font-size: 10.5px; color: var(--warm-slate); line-height: 1.35; }

    /* Context Interact Pill */
    #interactPillWrap {
      position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
      z-index: 25; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      pointer-events: none;
    }
    #interactPillWrap .btn {
      pointer-events: auto; padding: 8px 16px; font-size: 13px; border-radius: 999px;
      box-shadow: 0 6px 18px rgba(70, 69, 94, 0.25);
    }

    /* Bottom Right Dock */
    #bottomDock {
      position: fixed; bottom: 12px; right: 12px; z-index: 20;
      padding: 7px 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; justify-content: flex-end;
    }

    /* Toast / Banner */
    #toastBanner {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      z-index: 40; padding: 9px 18px; border-radius: 999px;
      background: rgba(70, 69, 94, 0.92); color: #FFF8EE;
      border: 2px solid var(--amber-glow);
      font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none; text-align: center; max-width: 86vw;
    }

    /* Interior Overlay Banner */
    #interiorBanner {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
      z-index: 26; padding: 7px 14px; display: flex; align-items: center; gap: 10px;
    }

    /* Dialogue Theater Box */
    #dialogueModal {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: min(680px, 92vw); z-index: 35; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .dlg-header { display: flex; align-items: center; gap: 12px; }
    .dlg-portrait {
      width: 58px; height: 58px; border-radius: 14px; object-fit: cover;
      border: 2px solid var(--border-wood); background: #FFF5E4; flex-shrink: 0;
    }
    .dlg-motion { padding: 0; flex-shrink: 0; }
    .dlg-motion canvas { display: block; width: 54px; height: 54px; }
    .dlg-text {
      font-size: 14.5px; line-height: 1.6; min-height: 46px;
      padding: 10px 12px; border-radius: 12px;
      background: #FFFDF8; border: 1.5px solid #EBD3B4;
    }
    .dlg-choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .dlg-choices .btn { flex: 1 1 200px; padding: 9px 12px; font-size: 13px; }
    .dlg-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* Slide-over Side Drawer & Center Modal */
    #drawerOverlay {
      position: fixed; inset: 0; z-index: 45;
      background: rgba(70, 69, 94, 0.34);
      display: flex; justify-content: flex-end;
    }
    #sideDrawer {
      width: min(560px, 96vw); height: 100%;
      background: #FFF8EC; border-left: 3px solid var(--border-wood);
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: -8px 0 32px rgba(70, 69, 94, 0.22);
    }
    .drawer-tabs {
      display: flex; gap: 4px; padding: 10px 12px; background: #F5E6C8;
      border-bottom: 2px solid var(--border-wood); overflow-x: auto; align-items: center;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .panel-box {
      background: #FFFDF8; border: 1.5px solid #E4BA8B; border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    @media (max-width: 600px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .pixel-grid {
      display: grid; grid-template-columns: repeat(12, 22px); gap: 2px;
      padding: 8px; background: #F5E6C8; border-radius: 10px; border: 1.5px solid var(--border-wood);
      width: fit-content; margin: 0 auto;
    }
    .pixel-cell {
      width: 22px; height: 22px; border-radius: 3px; border: 1px solid rgba(90, 88, 125, 0.16);
      cursor: pointer; padding: 0;
    }
    .swatch {
      width: 24px; height: 24px; border-radius: 999px; border: 2px solid transparent; cursor: pointer;
    }
    .swatch.active { border-color: var(--slate-ink); transform: scale(1.12); }

    /* 62 Assets Gallery Modal */
    #galleryModal {
      position: fixed; inset: 20px; z-index: 55;
      background: #FFF8EC; border: 3px solid var(--border-wood); border-radius: 20px;
      box-shadow: 0 20px 60px rgba(70, 69, 94, 0.35);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .asset-card {
      background: #FFFDF8; border: 1.5px solid #E4BA8B; border-radius: 12px; padding: 8px;
      display: flex; flex-direction: column; gap: 5px; cursor: pointer; text-align: left;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .asset-card:hover { transform: translateY(-2px); border-color: var(--terracotta); }
    .asset-thumb-wrap {
      width: 100%; height: 106px; border-radius: 8px; background: #F8EFE0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .asset-thumb { width: 100%; height: 100%; object-fit: contain; }
    .asset-fallback {
      font-size: 11px; color: var(--warm-slate); text-align: center; padding: 6px;
    }

    input[type="text"], select {
      padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--border-wood);
      background: #FFFDF8; color: var(--slate-ink); font-size: 12px;
    }
    .progress-bar {
      width: 100%; height: 8px; border-radius: 999px; background: #EAD9BF; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--sage-leaf); transition: width 0.25s ease; }
    .chip-action {
      font-size: 11px; padding: 2px 7px; border-radius: 8px; background: #EEEAF6;
      color: var(--warm-slate); border: 1px solid #D3CCE6; font-family: monospace;
    }
    .res-card {
      background: #FFFDF8; border: 1.5px solid #E4BA8B; border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- 顶部左上角：主线进度与章节控制 -->
  <div id="topLeftHud">
    <div id="chapterCard" class="hud-pill">
      <div class="chapter-row">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <strong style="font-size:14px;">🏡 时光小筑 · 抱月海湾 4×</strong>
          <span id="chapterBadge" class="badge">序幕</span>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          <button id="toggleQuestBtn" class="btn">📋 进度清单</button>
          <button id="toggleFreeRoamBtn" class="btn" title="切换正常剧情解锁或全岛自由漫游">🧭 漫游: 正常</button>
        </div>
      </div>
      <div id="chapterSubtitle" style="font-size:11.5px;color:var(--warm-slate);"></div>
    </div>

    <div id="questDropdown" class="hud-pill hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <strong>五幕主线进度 &amp; 快速测试推进</strong>
        <button id="closeQuestBtn" class="btn" style="padding:2px 7px;">✕</button>
      </div>
      <div id="questChecklist"></div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-wood);display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <span style="font-size:11px;color:var(--warm-slate);">快速审阅跳章：</span>
        <select id="chapterJumpSelect"></select>
        <button id="chapterJumpBtn" class="btn amber">跳转此章</button>
        <button id="triggerConcertBtn" class="btn primary">🎵 终章回声音乐会</button>
      </div>
    </div>
  </div>

  <!-- 顶部右上角：三时段、天气、统计数值 -->
  <div id="topRightHud">
    <div id="envBar" class="hud-pill">
      <button data-tod="afternoon" class="btn tod-btn active">☀️ 午后</button>
      <button data-tod="dusk" class="btn tod-btn">🌇 黄昏</button>
      <button data-tod="night" class="btn tod-btn">🌙 星夜</button>
      <select id="weatherSelect" title="海湾天气">
        <option value="sunny">🌤️ 暖阳</option>
        <option value="breeze">🍃 海风</option>
        <option value="rain">🌧️ 细雨</option>
        <option value="starlight">✨ 星芒</option>
      </select>
      <button id="photoSnapBtn" class="btn mint" title="拍照留念 (+1 拍照记录)">📷 拍照</button>
      <button id="bgmToggleBtn" class="btn" title="切换柔和八音盒氛围音">🎵 音乐:关</button>
      <button id="muteBtn" class="btn" title="静音切换">🔊</button>
    </div>
    <div class="hud-pill" style="padding:5px 10px;display:flex;gap:6px;flex-wrap:wrap;">
      <span class="stat-chip">💛 暖心 <span id="statWarm">0</span></span>
      <span class="stat-chip">📖 记忆 <span id="statMem">0</span>/26</span>
      <span class="stat-chip">🎭 剧本 <span id="statScripts">0</span>/27</span>
      <span class="stat-chip">📍 <span id="statZone">Zone 0</span></span>
    </div>
  </div>

  <!-- 室内模式提示栏 -->
  <div id="interiorBanner" class="hud-pill hidden">
    <strong id="interiorTitle" style="font-size:13px;">正在室内</strong>
    <span style="font-size:11.5px;color:var(--warm-slate);">点击室内陈设或按 E 交互</span>
    <button id="exitInteriorBtn" class="btn primary">🚪 走出室外 [E]</button>
  </div>

  <!-- Toast -->
  <div id="toastBanner" class="hidden"></div>

  <!-- 邻近交互快捷悬浮按钮 -->
  <div id="interactPillWrap"></div>

  <!-- 左下角：迷你雷达与操控提示 -->
  <div id="miniMapWrap" class="hud-pill">
    <canvas id="miniMapCanvas" width="176" height="152"></canvas>
    <div class="mini-hint">
      <b>WASD/方向键/点地面</b> 行走 · <b>滚轮</b> 缩放<br/>
      <b>按住拖动居民</b> 轻推(つまむ) · <b>E</b> 交互<br/>
      <span id="directorStatusLine" style="color:#8A5311;">导演调度：65/35 引力潮汐运行中</span>
    </div>
  </div>

  <!-- 右下角：功能抽屉入口 -->
  <div id="bottomDock" class="hud-pill">
    <button class="btn" data-drawer="mendel">🌷 孟德尔花圃</button>
    <button class="btn" data-drawer="flag">🚩 12×12像素旗</button>
    <button class="btn" data-drawer="chalk">🖍️ 黑板流行语</button>
    <button class="btn" data-drawer="codex">📖 居民与26记忆</button>
    <button class="btn amber" id="openGalleryBtn">🖼️ 62项3D特写</button>
    <button class="btn" data-drawer="save">💾 存档(<span id="dockBytes">0</span>B)</button>
  </div>

  <!-- 剧本 / 日常对话浮窗 -->
  <div id="dialogueModal" class="hud-pill hidden">
    <div class="dlg-header">
      <img id="dlgPortrait" class="dlg-portrait" alt="resident" />
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <strong id="dlgSpeaker" style="font-size:15px;">角色</strong>
          <span id="dlgBadge" class="badge">剧情</span>
          <span id="dlgActionChip" class="chip-action hidden"></span>
        </div>
        <div id="dlgSubtitle" style="font-size:11.5px;color:var(--warm-slate);margin-top:2px;"></div>
      </div>
      <button id="dlgMotionReplay" class="btn dlg-portrait dlg-motion hidden" aria-label="重播当前动作" title="重播当前动作">
        <canvas id="dlgMotionCanvas" width="108" height="108" aria-hidden="true"></canvas>
      </button>
      <button id="dlgCloseBtn" class="btn" style="padding:3px 9px;">✕</button>
    </div>
    <div id="dlgText" class="dlg-text"></div>
    <div id="dlgHintRow" class="hidden" style="font-size:11.5px;padding:6px 10px;border-radius:10px;background:#FFF3D6;border:1px solid #E4BA8B;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span id="dlgHintText"></span>
      <button id="dlgGoHintBtn" class="btn amber" style="padding:3px 9px;">✨ 前往演绎此幕</button>
    </div>
    <div id="dlgChoices" class="dlg-choices hidden"></div>
    <div class="dlg-footer">
      <div id="dlgFeedBar" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <select id="feedFoodSelect" style="max-width:155px;"></select>
        <button id="feedFoodBtn" class="btn mint">🥐 投喂试吃</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button id="dlgReplayVoiceBtn" class="btn">🔊 重听音节</button>
        <button id="dlgNextBtn" class="btn primary">继续 ▸ [Space]</button>
      </div>
    </div>
  </div>

  <!-- 侧边综合抽屉 -->
  <div id="drawerOverlay" class="hidden">
    <div id="sideDrawer">
      <div class="drawer-tabs">
        <button class="btn dtab" data-tab="mendel">🌷 花圃育种</button>
        <button class="btn dtab" data-tab="flag">🚩 像素旗</button>
        <button class="btn dtab" data-tab="chalk">🖍️ 黑板词库</button>
        <button class="btn dtab" data-tab="codex">📖 居民/记忆</button>
        <button class="btn dtab" data-tab="save">💾 存档/调试</button>
        <button id="closeDrawerBtn" class="btn" style="margin-left:auto;">✕</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </div>
  </div>

  <!-- 62项 3D 资产特写图鉴弹窗 -->
  <div id="galleryModal" class="hidden">
    <div class="drawer-tabs" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <strong style="font-size:15px;">🖼️ 62 项 3D 建模资产干净特写图鉴</strong>
        <span class="badge">全部本地离线路径 · 零外链</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <select id="galBatchFilter">
          <option value="all">全部批次 (62)</option>
          <option value="A">Batch A · 核心老镇 (20)</option>
          <option value="B">Batch B · 西东翼地标 (13)</option>
          <option value="C">Batch C · 北谷南屿捷径 (11)</option>
          <option value="D">Batch D · 9居民与微Props (18)</option>
        </select>
        <select id="galCatFilter">
          <option value="all">全部类型</option>
          <option value="architecture">建筑 architecture (29)</option>
          <option value="prop">道具设施 prop (20)</option>
          <option value="character">常驻居民 character (9)</option>
          <option value="flora">生态植被 flora (3)</option>
          <option value="ugc">轻拼贴 UGC (1)</option>
        </select>
        <input id="galSearchInput" type="text" placeholder="搜索编号或名称..." style="width:140px;" />
        <button id="closeGalleryBtn" class="btn primary">✕ 关闭</button>
      </div>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden;">
      <div id="galleryGridWrap" style="overflow-y:auto;padding:12px;">
        <div id="galleryGrid" class="gallery-grid"></div>
      </div>
      <div id="galleryDetail" style="overflow-y:auto;padding:14px;background:#FFFDF8;border-left:2px solid var(--border-wood);display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>

  <!-- 核心本地数据脚本（file:// 双击直接运行，零 CORS） -->
  <script src="../workspace/data/narrative-db.js"></script>
  <script src="../workspace/data/character-mini-scripts.js"></script>
  <script>
  (function () {
    "use strict";

    // ==================== 0. 数据校验与 62 项 3D 资产映射表 ====================
    const DB = window.SHIGUANG_DB;
    const MS = window.SHIGUANG_MINI_SCRIPTS;
    if (!DB || !MS) {
      alert("未能加载 ../workspace/data/narrative-db.js 或 character-mini-scripts.js，请确认在项目目录中打开。");
      return;
    }

      const affArr = MS.meta.storageSchema.charIndexOrder.map(cid => state.affection[cid] || 25);
      return {
        v: 4,
        ch: state.chapter,
        wf: state.warmFuzzies,
        aff: affArr,
        st: stArr,
        cm: state.choiceMask,
        dm: state.duoMask,
        dcm: state.duoChoiceMask,
        ev: state.events.join(","),

        mm: memMask.toString(16),

      };

    function ensureAudio() {
      if (isMuted) return null;

        if (AC) audioCtx = new AC();

    function playTone(freq, ms, wave = "triangle", vol = 0.07, delaySec = 0) {
      if (isMuted) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      const t = ctx.currentTime + delaySec;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(Math.max(80, freq), t);
      gain.gain.setValueAtTime(0.0008, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + ms / 1000);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + ms / 1000 + 0.02);
    }

    function speakVoice(text, sfxType, voiceProfile) {
      if (isMuted || !text) return;
      const baseHz = (voiceProfile ? (voiceProfile.basePitch || 1) : 1) * 340;
      const interval = voiceProfile ? (voiceProfile.charIntervalMs || 80) : 80;
      const maxChars = Math.min(text.length, 28);
      const chars = Array.from(text).slice(0, maxChars);
      chars.forEach((ch, idx) => {
        if (/[，。！？、\s「」『』—·…]/.test(ch)) return;
        const code = ch.charCodeAt(0);
        if (sfxType === "voice_mech" || (voiceProfile && voiceProfile.sfx === "voice_mech")) {
          const step = ((code % 5) - 2) * 10;
          playTone(baseHz * 0.72 + step, interval * 0.78, "square", 0.028, (idx * interval * 0.55) / 1000);
        } else {
          const mod = ((code * 37) % 130) - 35;
          playTone(baseHz + mod, interval * 0.85, "triangle", 0.068, (idx * interval * 0.55) / 1000);
        }
      });
    }

    function getElevationAt(x, z) {
      // L3 Twin Peaks
      if (Math.hypot(x - (-56), z - (-24)) < 10) return 5.4;
      if (Math.hypot(x - 0, z - 58) < 12) return 5.4;
      // L-0.5 East Intertidal Pool
      if (x >= 29 && x <= 43 && z >= -31 && z <= -21) return -0.25;
      // Zone S
      if (z <= -34 && x >= -36 && x <= 28) {
        if (Math.hypot(x - (-2), z - (-45)) < 9) return 1.4;
        return 0.2;
      }
      // Zone N
      if (z >= 28) {
        if (Math.hypot(x - (-36), z - 46) < 6) return 4.2;
        if (x >= -6 && x <= 30 && z >= 33 && z <= 38) return 3.2;
        return 3.6;

      // Core + W + E
      if (z >= 14) return 3.6;
      if (x <= -45 && z >= -18 && z <= -9) return 3.6; // F21
      if (x <= -42 && z >= 12) return 3.6; // F23
      if (x >= 40 && z >= 10) return 3.6; // F29/F30a

      return 0.2;

      C07: { body: "#AE8260", ear: "#8B6244", accent: "#7CC6E8", muzzle: "#F3DEC0" },
      C08: { body: "#9E9A95", ear: "#5A587D", accent: "#B96A59", muzzle: "#EFE9DD" },
      C09: { body: "#FFF5E4", ear: "#F4C2B8", accent: "#7CC6E8", muzzle: "#F7D9C4" }
    };

    const npcs = DB.residents.map((res, idx) => {
      const homeFac = DB.facilities.find(f => f.id === res.homeFacility) || DB.facilities[3];
      const angle = (idx * 2.1);
      const sx = homeFac.pos[0] + Math.cos(angle) * 2.2;
      const sz = homeFac.pos[2] + Math.sin(angle) * 2.0 - 1.5;
      const msChar = MS.characters.find(c => c.id === res.id);
      return {
        def: res,
        ms: msChar,
        id: res.id,
        name: res.name,
        species: res.species,
        x: sx, z: sz, y: getElevationAt(sx, sz),
        tx: sx, tz: sz,
        targetFacId: homeFac.id,
        state: "idle", // idle | wander | dragged | director_approach | scripted
        waitTimer: 1 + idx * 0.6,
        aiTimer: 0.4 * idx,
        bubble: null,
        bubbleTimer: 8 + idx * 3,
        actionAnim: null, // { type, t, dur }
        floatText: null, // { text, t }
        walkPhase: idx * 0.9
      };
    });

    const particles = [];
    const BUBBLE_COLORS = {
      bubble_yellow: "#FACC15",
      bubble_orange: "#FB923C",
      bubble_pink: "#F472B6",
      bubble_purple: "#A855F7"
    };

    function spawnParticles(wx, wy, wz, fxType, count = 8) {
      if (!fxType || fxType === "none") return;
      for (let i = 0; i < count; i++) {
        particles.push({
          type: fxType,
          x: wx + (Math.random() - 0.5) * 1.4,
          y: wy + 0.8 + Math.random() * 0.7,
          z: wz + (Math.random() - 0.5) * 1.0,
          vx: (Math.random() - 0.5) * 0.9,
          vy: 0.8 + Math.random() * 1.1,
          life: 1.4 + Math.random() * 0.7,
          maxLife: 2.0,
          size: 4 + Math.random() * 4
        });
      }
    }

    const RESIDENT_MOTION = {
      C01: { duration: 1.85, energy: 0.72, lean: 0.10, beats: 2, lead: -1 },
      C02: { duration: 1.55, energy: 0.82, lean: 0.24, beats: 2, lead: 1 },
      C03: { duration: 1.90, energy: 0.58, lean: 0.10, beats: 2, lead: 1 },
      C04: { duration: 1.30, energy: 1.35, lean: 0.15, beats: 3, lead: -1 },
      C05: { duration: 2.00, energy: 0.81, lean: 0.20, beats: 1, lead: -1 },
      C06: { duration: 2.10, energy: 0.75, lean: 0.17, beats: 1, lead: 1 },
      C07: { duration: 1.25, energy: 1.13, lean: 0.20, beats: 3, lead: 1 },
      C08: { duration: 1.45, energy: 0.88, lean: 0.11, beats: 2, lead: -1 },
      C09: { duration: 1.65, energy: 0.72, lean: 0.25, beats: 1, lead: 1 }
    };
    const MOTION_LABELS = {
      turn_to_player: "转向", greet: "打招呼", wave: "挥手", nod_tilt: "歪头点头",
      clap: "拍手", cheer: "欢呼", hop_bounce: "轻蹦", hover_bob: "悬浮起伏",
      pivot_spin: "转身", dance: "轻舞", paper_pet_squash: "纸片伸缩", sit: "坐下",
      water_bend: "弯腰浇水", photo: "合影", walk: "散步", run: "小跑"
    };

    function triggerNpcAction(npc, action, fx) {
      if (!npc) return;
      if (Object.hasOwn(MOTION_LABELS, action)) {
        npc.actionAnim = { type: action, t: 0, dur: RESIDENT_MOTION[npc.id].duration };
      }
      if (fx && fx !== "none") {
        spawnParticles(npc.x, npc.y, npc.z, fx, 10);
      }
    }

    // ==================== 5. 三时段 65/35 引力调度 + 8 秒软牵引防稀释 ====================
    let emptyOuterTimer = 0;
    let lastDirectorTrigger = 0;

    function pickUtilityTarget(npc) {
      const slot = DB.gravitySchedule.slots[state.timeSlot] || DB.gravitySchedule.slots.afternoon;
      const weights = npc.def.gravityWeights[state.timeSlot] || npc.def.gravityWeights.afternoon;
      const candidates = [];

      DB.facilities.forEach(fac => {
        if (!isFacilityUnlocked(fac)) return;
        let w = 0.05;
        if (weights && weights[fac.id]) w += weights[fac.id] * 2.5;
        if (slot.hotspotA.includes(fac.id)) w += 0.65;
        else if (slot.hotspotB.includes(fac.id)) w += 0.35;
        else if (slot.outerSlots.includes(fac.id)) w += 0.25;

        // Soft bias toward resident's next mini-script facility so player finds stories naturally
        const st = state.charStages[npc.id] || 0;
        if (npc.ms && st < 3) {
          const nextScript = npc.ms.scripts[st];
          if (nextScript && nextScript.trigger.facilityId === fac.id) w += 0.9;
        }
        candidates.push({ fac, w });
      });

      const total = candidates.reduce((s, c) => s + c.w, 0);
      let r = Math.random() * total;
      for (const c of candidates) {
        r -= c.w;
        if (r <= 0) return c.fac;
      }
      return candidates[0].fac;
    }

    function updateResidentsAI(dt) {
      const pZone = getZoneAt(player.x, player.z);
      const isOuter = pZone !== "Zone0";
      let nearbyCount = 0;
      npcs.forEach(n => {
        if (isResidentUnlocked(n.def) && Math.hypot(n.x - player.x, n.z - player.z) <= 28) nearbyCount++;
      });

      if (isOuter && nearbyCount === 0 && !interiorState) {
        emptyOuterTimer += dt;
        const dirEl = document.getElementById("directorStatusLine");
        if (dirEl) dirEl.textContent = `外围防空窗计时：${emptyOuterTimer.toFixed(1)}s / 8.0s`;
        if (emptyOuterTimer >= DB.gravitySchedule.directorSoftBias.triggerDelaySeconds && Date.now() - lastDirectorTrigger > 12000) {
          triggerSoftDirector(pZone);
          emptyOuterTimer = 0;
          lastDirectorTrigger = Date.now();
        }
      } else {
        emptyOuterTimer = Math.max(0, emptyOuterTimer - dt * 2);
        const dirEl = document.getElementById("directorStatusLine");
        if (dirEl) dirEl.textContent = `65/35 引力潮汐 · 视野内居民 ${nearbyCount} 位`;
      }

      npcs.forEach(npc => {
        if (npc.actionAnim) {
          npc.actionAnim.t += dt;
          if (npc.actionAnim.t >= npc.actionAnim.dur) npc.actionAnim = null;
        }
        if (!isResidentUnlocked(npc.def)) return;
        if (npc.state === "dragged") return;
        if (npc.floatText) {
          npc.floatText.t -= dt;
          if (npc.floatText.t <= 0) npc.floatText = null;
        }

        // Worry bubbles spawn occasionally
        npc.bubbleTimer -= dt;
        if (npc.bubbleTimer <= 0 && !npc.bubble) {
          const keys = ["yellow", "orange", "pink", "purple"];
          const k = keys[Math.floor(Math.random() * keys.length)];
          const pool = DB.worryBubbles[k];
          const ev = pool.events[Math.floor(Math.random() * pool.events.length)];
          npc.bubble = { key: k, id: pool.bubbleId, hex: pool.hex, label: pool.label, event: ev };
          npc.bubbleTimer = 22 + Math.random() * 18;
        }

        if (npc.state === "scripted") return;

        const dx = npc.tx - npc.x, dz = npc.tz - npc.z;
        const dist = Math.hypot(dx, dz);

        if (dist > 0.35) {
          const spd = npc.state === "director_approach" ? 2.8 : (npc.id === "C07" ? 2.2 : 1.55);
          npc.x += (dx / dist) * spd * dt;
          npc.z += (dz / dist) * spd * dt;
          npc.y = getElevationAt(npc.x, npc.z);
          npc.walkPhase += dt * spd * 3.5;

          if (npc.state === "director_approach" && Math.hypot(npc.x - player.x, npc.z - player.z) < 13) {
            npc.state = "idle";
            npc.waitTimer = 5;
            npc.floatText = { text: "咦，真巧呀！正好顺路来这里看海风～", t: 4.5 };
            triggerNpcAction(npc, "greet", "fx_sparkle");
          }
        } else {
          if (npc.state === "wander" || npc.state === "director_approach") {
            npc.state = "idle";
            npc.waitTimer = 4 + Math.random() * 5;
            const fac = DB.facilities.find(f => f.id === npc.targetFacId);
            if (fac && fac.allowedAction) triggerNpcAction(npc, fac.allowedAction, "none");
          } else {
            npc.waitTimer -= dt;
            if (npc.waitTimer <= 0) {
              const targetFac = pickUtilityTarget(npc);
              npc.targetFacId = targetFac.id;
              const ang = Math.random() * Math.PI * 2;
              const rad = 1.6 + Math.random() * 2.2;
              const nx = Math.max(-62, Math.min(62, targetFac.pos[0] + Math.cos(ang) * rad));
              const nz = Math.max(-49, Math.min(62, targetFac.pos[2] + Math.sin(ang) * rad));
              npc.tx = nx; npc.tz = nz;
              npc.state = "wander";
            }
          }
        }
      });
    }

    function triggerSoftDirector(zoneId) {
      const unlockedNpcs = npcs.filter(n => isResidentUnlocked(n.def) && n.state !== "dragged" && n.state !== "scripted");
      if (!unlockedNpcs.length) return;
      // Pick one far from player (> 20m) so no onscreen teleport!
      let candidate = unlockedNpcs
        .filter(n => Math.hypot(n.x - player.x, n.z - player.z) > 20)
        .sort((a, b) => Math.hypot(a.x - player.x, a.z - player.z) - Math.hypot(b.x - player.x, b.z - player.z))[0];
      if (!candidate) candidate = unlockedNpcs[0];

      // Position softly outside camera edge (22–26m from player, inside walkable zone) if super far (> 50m), else walk straight from current pos
      const d = Math.hypot(candidate.x - player.x, candidate.z - player.z);
      if (d > 44) {
        const ang = Math.atan2(candidate.z - player.z, candidate.x - player.x);
        const sx = Math.max(-60, Math.min(60, player.x + Math.cos(ang) * 24));
        const sz = Math.max(-48, Math.min(60, player.z + Math.sin(ang) * 24));
        if (isWalkable(sx, sz)) { candidate.x = sx; candidate.z = sz; }
      }
      const zoneFac = DB.facilities.find(f => f.zone === zoneId && isFacilityUnlocked(f)) || DB.facilities[0];
      candidate.tx = player.x + (Math.random() - 0.5) * 6;
      candidate.tz = player.z + (Math.random() - 0.5) * 6;
      candidate.targetFacId = zoneFac.id;
      candidate.state = "director_approach";
      const el = document.getElementById("directorStatusLine");
      if (el) el.textContent = `🎬 软牵引生效：${candidate.name} 从视野外自然踱步走来`;
    }

    // ==================== 6. Tracery 文本生成 & 黑板规则 ====================
    function expandTracery(expr, depth = 0) {
      if (depth > 6) return expr;
      return expr.replace(/#([a-zA-Z0-9_]+)#/g, (full, key) => {
        if (key === "lingo") {
          const pool = state.lingoPool.length ? state.lingoPool : DB.traceryGrammar.lingo;
          return pool[Math.floor(Math.random() * pool.length)];
        }
        if (key === "petName") return state.petName || "小白喵";
        const arr = DB.traceryGrammar[key];
        if (!arr || !arr.length) return full;
        const pick = arr[Math.floor(Math.random() * arr.length)];
        return expandTracery(pick, depth + 1);
      });
    }

    function pickBlackboardLine(npc) {
      const pZone = getZoneAt(npc.x, npc.z);
      const nearFac = DB.facilities.find(f => Math.hypot(f.pos[0] - npc.x, f.pos[2] - npc.z) < 9);
      const scored = DB.blackboardLines.map(bb => {
        if (bb.residentId !== "any" && bb.residentId !== npc.id) return null;
        const cond = bb.conditions || {};
        let score = bb.priority || 50;
        if (cond.chapter && cond.chapter !== state.chapter) score -= 45;
        if (cond.zone && cond.zone !== pZone) score -= 35;
        if (cond.facilityId && (!nearFac || nearFac.id !== cond.facilityId)) score -= 30;
        if (cond.timeSlot && cond.timeSlot !== state.timeSlot) score -= 25;
        if (cond.weather && cond.weather !== state.weather) score -= 18;
        if (cond.affectionMin && (state.affection[npc.id] || 0) < cond.affectionMin) return null;
        if (cond.yesterdayAction && cond.yesterdayAction !== state.yesterdayAction) score -= 20;
        score += Math.random() * 14;
        return { bb, score };
      }).filter(Boolean).sort((a, b) => b.score - a.score);

      if (scored.length) {
        const chosen = scored[0].bb;
        return {
          text: expandTracery(chosen.text),
          action: chosen.action || "greet",
          bubble: chosen.bubble
        };
      }
      return { text: expandTracery("#gossipBit#"), action: "greet", bubble: null };
    }

    // ==================== 7. 27 幕个人小剧本 & 3 段双人剧场引擎 ====================
    let activeDlg = null; // { mode, npc, script, lines, lineIdx, inReply, onComplete, typingTimer }

    function matchScriptTime(reqTod) {
      if (!reqTod || reqTod === "any") return true;
      if (reqTod === "day") return state.timeSlot === "afternoon";
      if (reqTod === "sunset") return state.timeSlot === "dusk" || state.timeSlot === "night";
      if (reqTod === "night") return state.timeSlot === "night";
      return true;
    }

    function checkConditionMet(npc, script) {
      const t = script.trigger;
      const cond = t.condition || {};
      const fac = DB.facilities.find(f => f.id === t.facilityId);
      const facUnlocked = !fac || isFacilityUnlocked(fac);
      const nearFac = !fac || Math.hypot(player.x - fac.pos[0], player.z - fac.pos[2]) < 15 || state.visitedFacilities.includes(t.facilityId);
      const todOk = matchScriptTime(t.timeOfDay);
      let condOk = true;
      if (cond.type === "nudge") condOk = (state.nudgeCounts[npc.id] || 0) >= (cond.minCount || 1);
      else if (cond.type === "water_flower") condOk = state.stats.waterCount >= (cond.minCount || 1);
      else if (cond.type === "ring_bell") condOk = state.stats.bellCount >= (cond.minCount || 1);
      else if (cond.type === "use_ferry") condOk = state.stats.ferryCount >= (cond.minCount || 1);
      else if (cond.type === "take_photo") condOk = state.stats.photoCount >= (cond.minCount || 1);
      else if (cond.type === "visit_facility") condOk = Math.hypot(player.x - fac.pos[0], player.z - fac.pos[2]) < 14 || state.visitedFacilities.includes(cond.facilityId);
      return { ok: facUnlocked && nearFac && todOk && condOk, facUnlocked, nearFac, todOk, condOk, fac };
    }

    function checkDuoReady(npc) {
      for (const d of MS.duoEncounters) {
        if ((state.duoMask >> d.duoBitIndex) & 1) continue;
        if (!d.participants.includes(npc.id)) continue;
        const okStages = d.participants.every(pid => (state.charStages[pid] || 0) >= (d.trigger.requireCharStages[pid] || 1));
        if (!okStages) continue;
        const p1 = npcs.find(n => n.id === d.participants[0]);
        const p2 = npcs.find(n => n.id === d.participants[1]);
        if (!p1 || !p2) continue;
        const dist = Math.hypot(p1.x - p2.x, p1.z - p2.z);
        const nearPlayer = Math.hypot(player.x - p1.x, player.z - p1.z) < 12;
        if (dist <= 8.0 && nearPlayer) return d;
      }
      return null;
    }

    function talkToNpc(npc) {
      if (!npc) return;
      state.talkCounts[npc.id] = (state.talkCounts[npc.id] || 0) + 1;

      // 1. Check Duo Encounter first
      const duo = checkDuoReady(npc);
      if (duo) {
        startDuoDialogue(duo);
        return;
      }

      // 2. Check Personal Stage Script
      const st = state.charStages[npc.id] || 0;
      if (npc.ms && st < 3) {
        const nextScript = npc.ms.scripts[st];
        const check = checkConditionMet(npc, nextScript);
        if (check.ok) {
          startMiniScriptDialogue(npc, nextScript);
          return;
        }
        // Fallback blackboard + helpful stage hint
        const bb = pickBlackboardLine(npc);
        startCasualDialogue(npc, bb, nextScript, check);
        return;
      }

      // 3. Epilogue / completed all 3 stages -> Blackboard / Tracery + Food Feeding
      const bb = pickBlackboardLine(npc);
      startCasualDialogue(npc, bb, null, null);
    }

    function startMiniScriptDialogue(npc, script) {
      npc.state = "scripted";
      activeDlg = {
        mode: "script",
        npc,
        script,
        lines: script.lines,
        lineIdx: 0,
        inReply: false,
        hintScript: null
      };
      renderDialogueStep();
    }

    function startDuoDialogue(duo) {
      const p1 = npcs.find(n => n.id === duo.participants[0]);
      const p2 = npcs.find(n => n.id === duo.participants[1]);
      if (p1) p1.state = "scripted";
      if (p2) p2.state = "scripted";
      activeDlg = {
        mode: "duo",
        npc: p1,
        npc2: p2,
        script: duo,
        lines: duo.lines,
        lineIdx: 0,
        inReply: false,
        hintScript: null
      };
      renderDialogueStep();
    }

    function startCasualDialogue(npc, bb, hintScript, hintCheck) {
      npc.state = "scripted";
      const lineObj = {
        speaker: npc.id,
        text: bb.text,
        action: bb.action || "greet",
        bubble: bb.bubble || "none",
        fx: "fx_sparkle",
        sfx: npc.ms ? npc.ms.defaultSfx : "voice_soft"
      };
      activeDlg = {
        mode: "casual",
        npc,
        script: null,
        lines: [lineObj],
        lineIdx: 0,
        inReply: true,
        hintScript,
        hintCheck
      };
      renderDialogueStep();
    }

    let typeTimer = null;
    const motionReplay = document.getElementById("dlgMotionReplay");
    const motionCanvas = document.getElementById("dlgMotionCanvas");
    const motionCtx = motionCanvas.getContext("2d");
    let dialogueMotion = null;
    motionReplay.addEventListener("click", () => {
      if (activeDlg && dialogueMotion) triggerNpcAction(dialogueMotion.npc, dialogueMotion.action);
    });
    function renderDialogueStep() {
      if (!activeDlg) return;
      const modal = document.getElementById("dialogueModal");
      modal.classList.remove("hidden");

      const line = activeDlg.lines[activeDlg.lineIdx];
      const speakerNpc = npcs.find(n => n.id === line.speaker) || activeDlg.npc;
      const asset = ASSET_BY_CODE[speakerNpc.id];

      const img = document.getElementById("dlgPortrait");
      img.src = asset ? `../workspace/assets/3d-modeling-closeups/${asset.id}.png` : "";
      img.onerror = () => { img.removeAttribute("src"); };

      document.getElementById("dlgSpeaker").textContent = `${speakerNpc.def.species} · ${speakerNpc.name}`;
      const badge = document.getElementById("dlgBadge");
      if (activeDlg.mode === "script") {
        badge.textContent = `阶段 ${activeDlg.script.stage}/3 · ${activeDlg.script.stageLabel}`;
        document.getElementById("dlgSubtitle").textContent = `《${activeDlg.script.title}》 · 好感 ${state.affection[speakerNpc.id]}/255`;
      } else if (activeDlg.mode === "duo") {
        badge.textContent = `双人微剧场 ${activeDlg.script.scriptId}`;
        document.getElementById("dlgSubtitle").textContent = `${activeDlg.script.title} · ${activeDlg.script.participantNames.join(" × ")}`;
      } else {
        badge.textContent = "日常对话";
        const tier = speakerNpc.def.bondTiers.find(t => state.affection[speakerNpc.id] >= t.range[0] && state.affection[speakerNpc.id] <= t.range[1]) || speakerNpc.def.bondTiers[0];
        document.getElementById("dlgSubtitle").textContent = `${tier.label} (${state.affection[speakerNpc.id]}/255) · ${speakerNpc.def.quirk.name}`;
      }

      const actChip = document.getElementById("dlgActionChip");
      const motionLabel = Object.hasOwn(MOTION_LABELS, line.action) ? MOTION_LABELS[line.action] : null;
      dialogueMotion = motionLabel ? { npc: speakerNpc, action: line.action } : null;
      motionReplay.classList.toggle("hidden", !dialogueMotion);
      if (motionLabel) {
        motionReplay.setAttribute("aria-label", `重播${speakerNpc.name}的${motionLabel}动作`);
        motionReplay.title = motionReplay.getAttribute("aria-label");
      }
      if (line.action && line.action !== "none") {
        actChip.classList.remove("hidden");
        actChip.textContent = `🎬 ${motionLabel || line.action}` + (line.fx && line.fx !== "none" ? ` + ${line.fx}` : "");
      } else {
        actChip.classList.add("hidden");
      }

      // Trigger visual action & bubble on live Canvas!
      triggerNpcAction(speakerNpc, line.action, line.fx);
      if (line.bubble && line.bubble !== "none") {
        speakerNpc.bubble = {
          key: line.bubble.replace("bubble_", ""),
          id: line.bubble,
          hex: BUBBLE_COLORS[line.bubble] || "#FACC15",
          label: "剧场表情",
          event: null
        };
      }

      // Typewriter + Voice
      if (typeTimer) clearInterval(typeTimer);
      const textEl = document.getElementById("dlgText");
      textEl.textContent = "";
      const fullText = line.text;
      let idx = 0;
      speakVoice(fullText, line.sfx, speakerNpc.ms ? speakerNpc.ms.voiceProfile : null);
      typeTimer = setInterval(() => {
        idx += 2;
        textEl.textContent = fullText.slice(0, idx);
        if (idx >= fullText.length) { clearInterval(typeTimer); typeTimer = null; }
      }, 28);

      // Show hint row if casual dialogue has a pending next script
      const hintRow = document.getElementById("dlgHintRow");
      if (activeDlg.hintScript && activeDlg.hintCheck) {
        hintRow.classList.remove("hidden");
        const hs = activeDlg.hintScript;
        document.getElementById("dlgHintText").textContent = `💡 下一幕「${hs.title}」：${hs.trigger.summaryZh}`;
        const goBtn = document.getElementById("dlgGoHintBtn");
        goBtn.style.display = activeDlg.hintCheck.facUnlocked ? "inline-flex" : "none";
      } else {
        hintRow.classList.add("hidden");
      }

      // Choices or Next button
      const choicesEl = document.getElementById("dlgChoices");
      const nextBtn = document.getElementById("dlgNextBtn");
      const isLastLine = activeDlg.lineIdx >= activeDlg.lines.length - 1;

      if (!activeDlg.inReply && isLastLine && activeDlg.script && activeDlg.script.choice) {
        choicesEl.classList.remove("hidden");
        choicesEl.innerHTML = "";
        activeDlg.script.choice.options.forEach(opt => {
          const b = document.createElement("button");
          b.className = "btn amber";
          b.textContent = `${opt.id}. ${opt.label}`;
          b.addEventListener("click", () => chooseDialogueOption(opt));
          choicesEl.appendChild(b);
        });
        nextBtn.classList.add("hidden");
      } else {
        choicesEl.classList.add("hidden");
        nextBtn.classList.remove("hidden");
        nextBtn.textContent = isLastLine ? "完成对话 ✓" : "继续 ▸ [Space]";
      }

      // Populate Food Select
      const feedSel = document.getElementById("feedFoodSelect");
      if (!feedSel.options.length) {
        DB.foodMatrix.signatureCatalog.forEach(fd => {
          const o = document.createElement("option");
          o.value = fd.name;
          o.textContent = fd.name;
          feedSel.appendChild(o);
        });

    function chooseDialogueOption(opt) {
      if (!activeDlg || !activeDlg.script) return;
      const sc = activeDlg.script;
      if (activeDlg.mode === "script") {
        const charIdx = MS.meta.storageSchema.charIndexOrder.indexOf(sc.charId);
        const bitPos = charIdx * 3 + (sc.stage - 1);
        if (opt.bit === 1) state.choiceMask |= (1 << bitPos);
        state.charStages[sc.charId] = Math.max(state.charStages[sc.charId] || 0, sc.stage);
        addAffection(sc.charId, opt.affectionDelta || 10);
        state.warmFuzzies += 15;
        playFanfareSfx();
      } else if (activeDlg.mode === "duo") {
        state.duoMask |= (1 << sc.duoBitIndex);
        if (opt.bit === 1) state.duoChoiceMask |= (1 << sc.duoBitIndex);
        sc.participants.forEach(pid => addAffection(pid, opt.affectionDelta || 10));
        state.warmFuzzies += 25;
        playFanfareSfx();
      }
      activeDlg.inReply = true;
      activeDlg.lines = opt.replyLines;
      activeDlg.lineIdx = 0;
      renderDialogueStep();
      checkChapterAdvance();
      updateStatsHUD();
    }

    function advanceDialogue() {
      if (!activeDlg) return;
      if (typeTimer) {
        clearInterval(typeTimer); typeTimer = null;
        document.getElementById("dlgText").textContent = activeDlg.lines[activeDlg.lineIdx].text;
        return;
      }
      if (activeDlg.lineIdx < activeDlg.lines.length - 1) {
        activeDlg.lineIdx++;
        renderDialogueStep();
        return;
      }
      // Finished!
      closeDialogue(true);
    }

    function closeDialogue(completed) {
      if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
      if (activeDlg) {
        if (activeDlg.npc) activeDlg.npc.state = "idle";
        if (activeDlg.npc2) activeDlg.npc2.state = "idle";
        if (completed && activeDlg.mode === "casual") {
          addAffection(activeDlg.npc.id, 3);
          state.warmFuzzies += 4;
        }
      }
      activeDlg = null;
      dialogueMotion = null;
      document.getElementById("dialogueModal").classList.add("hidden");
      checkChapterAdvance();
      updateStatsHUD();
    }

    function addAffection(charId, delta) {
      state.affection[charId] = Math.min(255, Math.max(0, (state.affection[charId] || 25) + delta));
    }

    function feedResident(npc, foodName) {
      const prefs = npc.def.foodPreferences;
      let tierId = "neutral";
      if (prefs.superLove.includes(foodName)) tierId = "super_love";
      else if (prefs.like.includes(foodName)) tierId = "like";
      else if (prefs.dislike.includes(foodName)) tierId = "dislike";
      else if (prefs.soulLeave.includes(foodName)) tierId = "soul_leave";

      const tier = DB.foodMatrix.reactionTiers.find(t => t.id === tierId);
      addAffection(npc.id, tier.affectionDelta);
      state.warmFuzzies += tier.warmFuzzies;
      state.yesterdayAction = "fed_bun";
      triggerNpcAction(npc, tier.action, tier.particle || "fx_sparkle");

      const lines = {
        super_love: `哇呜！！「${foodName}」是我这辈子最爱吃的东西！幸福得想原地跳舞！`,
        like: `真香呀～「${foodName}」太合我胃口了，谢谢你的投喂！`,
        neutral: `嗯嗯，「${foodName}」味道挺温和的，慢慢吃真不错。`,
        dislike: `唔……「${foodName}」稍微有点特别呢，不过心意我收下啦！`,
        soul_leave: `呃啊啊——「${foodName}」的味道直冲天灵盖，灵魂都要飘出半米啦！（依然感谢！）`
      };
      playTone(tierId === "soul_leave" ? 210 : 620, 140, tierId === "soul_leave" ? "square" : "triangle", 0.07, 0);
      showToast(`🍽️ 投喂 ${npc.name}「${foodName}」：${tier.label} (+${tier.affectionDelta}好感)`);

          const ok = state.visitedFacilities.includes("F19") && state.visitedFacilities.includes("F20") &&
            state.visitedFacilities.includes("F22") && state.events.includes("lighthouse_relight") &&
            state.collectedMemories.length >= 3;
